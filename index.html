<style>
/* ================= Tokens ================= */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --gold:#D9A92B; --silver:#B7C1BB; --bronze:#C98452; --chalk:#FBF8F1; --net:#15191A;
  --line:color-mix(in srgb,var(--text) 13%,transparent);
  --line-strong:color-mix(in srgb,var(--text) 30%,transparent);
  --topbar:color-mix(in srgb,var(--bg) 92%,transparent);
  /* default: polvo oscuro */
  --bg:#1B130F;--surface:#281C15;--surface-2:#33241B;--text:#F6EFE7;--muted:#C7B1A1;
  --accent:#D0652F;--accent-2:#B0521F;--accent-ink:#FFF7EF;--ball:#DDE95B;--ball-ink:#1C2200;
  --win:#8FD9A8;--loss:#F4927F;--court-in:#C0582B;--court-out:#AE4D24;--grain:.28;--mow:0;
}
:root[data-surface="polvo"][data-mode="dark"]{--bg:#1B130F;--surface:#281C15;--surface-2:#33241B;--text:#F6EFE7;--muted:#C7B1A1;--accent:#D0652F;--accent-2:#B0521F;--accent-ink:#FFF7EF;--ball:#DDE95B;--ball-ink:#1C2200;--win:#8FD9A8;--loss:#F4927F}
:root[data-surface="polvo"][data-mode="light"]{--bg:#F4ECE4;--surface:#FFFDFB;--surface-2:#F7EFE7;--text:#2B1A11;--muted:#7B5F4E;--accent:#B8522A;--accent-2:#9A431F;--accent-ink:#FFF7EF;--ball:#C3D431;--ball-ink:#2F3600;--win:#1F8A55;--loss:#C2473A}
:root[data-surface="polvo"]{--court-in:#C0582B;--court-out:#AE4D24;--grain:.28;--mow:0}
:root[data-surface="cesped"][data-mode="dark"]{--bg:#0C2417;--surface:#123220;--surface-2:#193F29;--text:#EFF3EC;--muted:#A3BCA8;--accent:#8457C2;--accent-2:#6C43A6;--accent-ink:#FFFFFF;--ball:#DDE95B;--ball-ink:#1C2200;--win:#8FD9A8;--loss:#F4927F}
:root[data-surface="cesped"][data-mode="light"]{--bg:#ECF3EA;--surface:#FFFFFF;--surface-2:#F2F7F0;--text:#0F2618;--muted:#56705E;--accent:#5B2E8C;--accent-2:#4A2474;--accent-ink:#FFFFFF;--ball:#C3D431;--ball-ink:#2F3600;--win:#1F8A55;--loss:#C2473A}
:root[data-surface="cesped"]{--court-in:#4B8C38;--court-out:#417D30;--grain:.14;--mow:1}
:root[data-surface="dura"][data-mode="dark"]{--bg:#0B1828;--surface:#122338;--surface-2:#192E47;--text:#EEF3F9;--muted:#9EB2C8;--accent:#3C86DB;--accent-2:#2C6FBF;--accent-ink:#FFFFFF;--ball:#DDE95B;--ball-ink:#1C2200;--win:#8FD9A8;--loss:#F4927F}
:root[data-surface="dura"][data-mode="light"]{--bg:#E9F0F8;--surface:#FFFFFF;--surface-2:#F1F5FA;--text:#0E1E32;--muted:#52667E;--accent:#1F5FAE;--accent-2:#194E90;--accent-ink:#FFFFFF;--ball:#C3D431;--ball-ink:#2F3600;--win:#1F8A55;--loss:#C2473A}
:root[data-surface="dura"]{--court-in:#2D66A3;--court-out:#3A7753;--grain:.1;--mow:0}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);transition:background-color .4s ease,color .4s ease;
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.display{font-stretch:68%;font-weight:850;line-height:.92;letter-spacing:-.005em;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}

/* ================= Top bar ================= */
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;flex:none;min-width:34px}
.brand-mark{width:34px;height:22px;border-radius:3px;background:var(--court-in);position:relative;flex:none;box-shadow:inset 0 0 0 2px var(--chalk);transition:background-color .4s}
.brand-mark::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--net)}
.brand b{font-stretch:70%;font-weight:850;font-size:1.3rem;white-space:nowrap}
.brand .city{color:var(--muted);font-size:.9rem}
.nav{display:flex;gap:2px}
.nav a{white-space:nowrap;text-decoration:none;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.95rem;position:relative}
.nav a:hover,.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:-11px;height:3px;background:var(--accent);border-radius:3px}
.swatches{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:99px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--text)}
.sw-polvo{background:#C0582B}.sw-cesped{background:#4B8C38}.sw-dura{background:#2D66A3}
.theme-btn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.theme-btn:hover{color:var(--text)}
.adminbar{background:var(--ball);color:var(--ball-ink);font-size:.85rem;font-weight:700}
.adminbar .wrap{display:flex;align-items:center;gap:14px;min-height:34px}
.adminbar a,.adminbar button{color:inherit;background:none;border:0;cursor:pointer;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:0}
.adminbar span{margin-right:auto}
.tabbar{display:none}
@media (max-width:900px){
  .nav{display:none}.brand .city{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--topbar);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:600;white-space:nowrap}
  .tabbar a[aria-current="page"]{color:var(--text)}
  .tabbar a[aria-current="page"] svg{color:var(--accent)}
  .tabbar a[aria-current="page"] svg .fill{fill:var(--ball);stroke:var(--ball-ink)}
  main{padding-bottom:84px}
}

/* ================= Shared ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.95rem;
  text-decoration:none;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ball{background:var(--ball);color:var(--ball-ink)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--loss);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--loss) 60%,transparent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:nowrap}
.seg button,.seg a{border:0;background:none;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);text-decoration:none;white-space:nowrap}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--text);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;color:var(--muted)}
.search input{border:0;background:none;outline:none;width:170px;color:var(--text)}
.search svg.i{width:18px;height:18px}
.page{padding-top:30px;padding-bottom:44px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:20px}
.page-head h1{font-size:clamp(2.6rem,7vw,4.4rem)}
.page-head .sub{color:var(--muted);margin:6px 0 0;font-size:1.05rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:.84rem;color:var(--muted);margin-top:14px}
.edit-link{font-size:.82rem;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:34px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:1.15rem;margin-bottom:6px}
.empty .btn{margin-top:16px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.round-label{font-stretch:75%;font-weight:800;font-size:1.2rem;margin:26px 0 10px}
.pill{display:inline-grid;place-items:center;min-width:2.5rem;height:1.75rem;padding:0 6px;border-radius:6px;font-weight:750;font-size:.9rem;font-variant-numeric:tabular-nums;font-stretch:88%}
.p100{background:var(--gold);color:#2A1E00}.p80{background:var(--silver);color:#15201A}.p60{background:var(--bronze);color:#2A1406}
.p40{color:var(--text)}.p20{color:var(--muted)}
.p10{color:var(--muted);opacity:.75}.p5{color:var(--muted);opacity:.6;font-size:.8rem}.p0{color:var(--muted);opacity:.5;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}

/* ================= Home ================= */
.hero{padding-top:36px}
.hero h1{font-size:clamp(3.2rem,11vw,7.5rem)}
.lede{font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--muted);margin:14px 0 26px;max-width:42ch}
.court-wrap{position:relative;border-radius:12px;overflow:hidden;background:var(--court-out)}
.court{display:block;width:100%;height:auto}
.surf{transition:fill .45s ease,opacity .45s ease}
.court .lines *{fill:none;stroke:var(--chalk);stroke-width:9;stroke-dasharray:1;stroke-dashoffset:0}
.court.draw .lines *{animation:chalk 1.4s cubic-bezier(.6,.1,.2,1) both}
.court.draw .lines *:nth-child(n+2){animation-delay:.25s}
.court.draw .lines *:nth-child(n+4){animation-delay:.45s}
@keyframes chalk{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.overlay{position:absolute;left:6%;right:6%;top:10%;bottom:10%;display:grid;grid-template-columns:1fr 1fr}
.half{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 6%;
  text-shadow:0 2px 0 rgba(0,0,0,.28),0 0 16px rgba(0,0,0,.6),0 0 4px rgba(0,0,0,.45);background:radial-gradient(closest-side,rgba(0,0,0,.26),rgba(0,0,0,0))}
.half .cat{font-weight:800;font-size:clamp(.78rem,1.5vw,1.05rem)}
.half .champ{font-stretch:66%;font-weight:900;font-size:clamp(1.35rem,5vw,3.4rem);line-height:.95;margin-top:4px}
.half .first{font-size:clamp(.85rem,1.7vw,1.15rem);font-weight:700}
.half .detail{margin-top:10px;font-size:.92rem;font-weight:600;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:99px;text-shadow:none}
.court-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.court-caption{display:none;color:var(--muted);font-size:.95rem;margin:0}
.court-bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.court-bar .lbl{font-size:.85rem;color:var(--muted)}
.court-bar .seg button{padding:6px 12px;font-size:.85rem}
@media (max-width:600px){.half .detail{display:none}.court-caption{display:block}}

.info{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.info-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.info h2{display:flex;align-items:center;gap:8px;font-stretch:72%;font-weight:850;font-size:1.6rem;line-height:1;margin:0}
.info h2 svg{color:var(--accent)}
.info p{margin:0;font-size:1.05rem;max-width:70ch}
.info.photo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:center}
@media (max-width:760px){.info.photo{grid-template-columns:1fr}}
/* Tarjeta "Dónde estamos": dirección, mapa tocable y redes del club */
.where-dir{margin:0 0 14px}
.where-map{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);height:220px}
.where-map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.where-hit{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:12px;text-decoration:none}
.where-cta{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.95rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.where-hit:hover .where-cta{background:var(--accent-2)}
.where-social{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px}
.where-social .lbl{font-size:.85rem;color:var(--muted);margin-right:4px}
.soc{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:99px;border:1px solid var(--line-strong);color:var(--text);text-decoration:none;font-weight:700;font-size:.9rem}
.soc:hover{background:var(--surface-2)}
.soc svg.i{width:18px;height:18px;color:var(--accent)}
.sched-title{font-stretch:75%;font-weight:800;font-size:1.25rem;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
.day h3{font-size:.95rem;font-weight:700;color:var(--muted);margin:12px 0 8px}
.day-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
@media (max-width:600px){.day-row{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:80%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .day-row > *{scroll-snap-align:start}}
.sched{border:0;padding:0;background:none;cursor:zoom-in;display:block;width:100%}
.sched .thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sched img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sched-foot{margin-top:8px;font-weight:750;font-size:.95rem}
.sched-foot small{color:var(--muted);font-weight:500;margin-left:6px}

/* Mini court */
.mc{position:relative;border-radius:10px;overflow:hidden;background:var(--court-out);transition:background-color .45s;container-type:inline-size}
.mc svg{display:block;width:100%;height:auto}
.mc .mc-top,.mc .mc-bottom{position:absolute;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font-size:.74rem;font-weight:800;color:#fff}
.mc .mc-top{top:6px}.mc .mc-bottom{bottom:5px;justify-content:center}
.mc .tag{background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px;white-space:nowrap}
.mc .tag.gold{background:var(--gold);color:#2A1E00}
.mc .mc-sides{position:absolute;left:7%;right:7%;top:21%;bottom:15%;display:grid;grid-template-columns:1fr 1fr}
.mc .side{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;min-width:0}
.mc .side:first-child{padding:0 9px 0 2px}.mc .side:last-child{padding:0 2px 0 9px}
.mc .plate{display:flex;flex-direction:column;align-items:center;max-width:100%;min-width:0;background:rgba(8,12,10,.72);
  border-radius:7px;padding:4px 9px 5px;box-shadow:0 2px 8px rgba(0,0,0,.25);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.mc .plate b{font-stretch:72%;font-weight:850;font-size:clamp(.82rem,5cqi,1.6rem);line-height:1.05;max-width:100%;white-space:normal;text-align:center}
.mc .plate small{font-size:clamp(.66rem,3.4cqi,.95rem);font-weight:600;opacity:.8;line-height:1.15}
.mc .side.lose .plate{background:rgba(8,12,10,.5)}
.mc .side.lose .plate b{font-weight:700;opacity:.88}
.mc .side.win .plate{box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 8px rgba(0,0,0,.3)}
.mc .side .tro{width:clamp(16px,6cqi,26px);height:clamp(16px,6cqi,26px);color:var(--gold);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));margin-bottom:3px}

.mod-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:99px;
  vertical-align:middle;margin-left:8px;letter-spacing:0;font-stretch:100%;line-height:1.3}
h1 .mod-tag{font-size:.9rem;vertical-align:.9em}
#modslot{display:flex;gap:8px}
.yearsel-wrap{display:inline-flex;align-items:center;gap:8px}.lbl-year{font-size:.85rem;font-weight:700;color:var(--muted)}
.page-tools{display:flex;justify-content:flex-end;margin-bottom:14px}
select.yearsel{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:700;font-size:.85rem;padding:0 10px;cursor:pointer}
.danger-zone{border:1.5px solid color-mix(in srgb,var(--loss) 55%,transparent);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.danger-zone strong{color:var(--loss)}
a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font:inherit!important;pointer-events:none!important}
.ayear{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.ayear-head{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;background:none;color:var(--text);cursor:pointer;text-align:left;font:inherit}
.ayear-title{font-stretch:72%;font-weight:900;font-size:1.6rem;line-height:1;margin-right:auto}
.ayear-body{display:flex;flex-direction:column;gap:10px;padding:0 12px 12px}
svg.achev{width:18px;height:18px;color:var(--muted);transition:transform .18s;flex:none}
[aria-expanded="true"] > svg.achev{transform:rotate(90deg)}
.acard{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.acard.open{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.acard-head{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px}
.acard-toggle{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;flex:1;min-width:0;border:0;background:none;color:var(--text);cursor:pointer;text-align:left;font:inherit;padding:8px 6px}
.acard-title{font-stretch:80%;font-weight:800;font-size:1.1rem}
.acard-toggle .chip{margin-left:0}
.acard-sum{width:100%;padding-left:28px;color:var(--muted);font-size:.85rem}
.acard-body{display:flex;flex-direction:column;gap:12px;padding:4px 16px 16px;border-top:1px solid var(--line);padding-top:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.check{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--text);font-weight:600;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}
.check:has(input:checked){border-color:var(--accent)}
.modseg button{padding:6px 11px;font-size:.85rem}
.mod-pick{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:-4px 0 16px;color:var(--muted);font-size:.9rem;font-weight:600}
.cat-group{margin-top:20px}
.cat-group + .cat-group{padding-top:18px;border-top:1px dashed var(--line)}
.cat-h{display:flex;align-items:center;gap:8px;font-stretch:75%;font-weight:850;font-size:1.3rem;margin:0}
.cat-h::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--court-in);box-shadow:inset 0 0 0 1.5px var(--chalk)}
.day h4{font-size:.85rem;font-weight:700;color:var(--muted);margin:10px 0 6px}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.champ-mini{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px}
.champ-mini small{color:var(--muted);font-weight:700;display:block;font-size:.8rem}
.champ-mini strong{font-stretch:72%;font-weight:900;font-size:1.5rem;line-height:1.05;display:block}
.champ-mini span{color:var(--muted);font-size:.85rem}
@media (max-width:1120px){.brand .city{display:none}}
@media (max-width:560px){.topbar .wrap{gap:8px}.modseg button{padding:5px 8px;font-size:.78rem}

  .swatch{width:18px;height:18px}.swatches{gap:4px;padding:3px}.theme-btn{width:34px;height:34px}}

.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.news-item{border-radius:12px;padding:22px 22px 20px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.news-item h2{font-stretch:72%;font-weight:850;font-size:1.7rem;line-height:1;margin:0 0 8px}
.news-item p{margin:0 0 16px;color:var(--muted);max-width:48ch}
.news-item.destacada{background:var(--net);color:var(--chalk);border:0}
.news-item.destacada p{color:rgba(251,248,241,.75)}
.news-item.destacada::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--ball);box-shadow:inset -18px -10px 0 rgba(0,0,0,.08)}
.news-item.destacada > *{position:relative;z-index:1;max-width:calc(100% - 90px)}
.section-title{font-stretch:72%;font-weight:850;font-size:1.6rem;margin:40px 0 8px}
.explore{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.row:first-child{border-top:1px solid var(--line)}
.row .row-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.row strong{display:block;font-stretch:78%;font-weight:800;font-size:1.2rem}
.row .row-text span{color:var(--muted);font-size:.95rem}
.row .chev{margin-left:auto;color:var(--muted)}
.row:hover strong{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--accent)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:34px;padding-bottom:40px;color:var(--muted);font-size:.85rem}
.foot a{color:var(--muted)}

/* ================= Ranking ================= */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.82rem;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .pill{min-width:2rem;height:1.4rem;font-size:.75rem}
.table-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.rank{width:100%;border-collapse:collapse}
.rank th{font-size:.78rem;font-weight:700;color:var(--muted);text-align:center;padding:12px 6px;border-bottom:1px solid var(--line)}
.rank th.left{text-align:left}
.rank td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.rank tr:last-child td{border-bottom:0}
.rank td.player{text-align:left}
.ap{font-weight:750}.nom{color:var(--muted)}
.rank .star{color:var(--gold);margin-left:4px;font-size:.85rem}
.rank .total{font-stretch:75%;font-weight:900;font-size:1.35rem;font-variant-numeric:tabular-nums;text-align:right;padding-right:18px}
.pos{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.pos.m1{background:var(--gold);color:#2A1E00}.pos.m2{background:var(--silver);color:#15201A}.pos.m3{background:var(--bronze);color:#2A1406}
.rank tr.me td{background:color-mix(in srgb,var(--ball) 18%,transparent)}
.me-tag{display:inline-block;margin-left:6px;background:var(--ball);color:var(--ball-ink);font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:99px;vertical-align:1px}
.rank tr.cut td{padding:0;border-bottom:0}
.cut-line{display:flex;align-items:center;padding:6px 16px;font-size:.78rem;font-weight:700;color:var(--gold);
  background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 18px) center/100% 2px no-repeat}
.cut-line span{background:var(--surface);padding:0 8px;margin:0 auto}
.long{display:inline}.short{display:none}
@media (max-width:600px){
  .long{display:none}.short{display:inline}
  .rank th,.rank td{padding-left:3px;padding-right:3px}
  .rank .nom{display:block;font-size:.82rem;line-height:1.2}
  .pill{min-width:2.1rem;height:1.6rem;font-size:.82rem}
  .rank .total{padding-right:12px;font-size:1.2rem}
  .search input{width:120px}
}

/* ================= Torneos ================= */
.timeline{position:relative;padding-left:48px}
.timeline::before{content:"";position:absolute;left:16px;top:10px;bottom:10px;width:2px;background:var(--line-strong)}
.tcard{position:relative;margin-bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.tnode{position:absolute;left:-48px;top:22px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:850;font-stretch:80%;box-shadow:0 0 0 5px var(--bg)}
.tcard.live .tnode{background:var(--ball);color:var(--ball-ink)}
.thead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:16px;border:0;background:none;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.thead h2{font-stretch:66%;font-weight:900;font-size:clamp(2.1rem,5vw,3.2rem);line-height:.9;margin:0}
.thead .dates{color:var(--muted)}
.tcard:has(.thead[aria-expanded="false"]){padding-bottom:22px}
.thead[aria-expanded="false"]{margin-bottom:0}
svg.tchev{width:20px;height:20px;flex-shrink:0;transition:transform .18s;color:var(--muted)}
.thead[aria-expanded="true"] svg.tchev{transform:rotate(90deg)}
.tsummary{margin:0;color:var(--muted);font-size:.92rem}
.chip{margin-left:auto;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.fin{color:var(--win)}.chip.live{background:var(--ball);color:var(--ball-ink)}
.tfinals{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tfinal .actions{display:flex;gap:8px;margin-top:10px}
@media (max-width:640px){.timeline{padding-left:0}.timeline::before,.tnode{display:none}}

/* ================= Scoreboards ================= */
.sb{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sb-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),2.5rem);align-items:stretch;min-height:2.7rem}
.sb-row + .sb-row{border-top:1px solid var(--line)}
.sb-name{padding:.55rem .9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);align-self:center}
.sb-name::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.55rem;vertical-align:1px;background:transparent}
.sb-row.w .sb-name{color:var(--text);font-weight:750}
.sb-row.w .sb-name::before{background:var(--ball);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.g{display:grid;place-items:center;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;font-stretch:85%;font-size:1.08rem;font-weight:600;color:var(--muted)}
.g.won{color:var(--text);font-weight:850}.g.st{background:var(--surface-2);font-size:.92rem}.g.wo{font-size:.8rem;font-weight:800;color:var(--text)}
.g.pad{border-left-color:transparent}
.sb.c .sb-row{grid-template-columns:minmax(0,1fr) repeat(var(--n),1.35rem);min-height:2.05rem}
.sb.c .sb-name{padding:.3rem .45rem;font-size:.78rem}
.sb.c .sb-name::before{width:.42rem;height:.42rem;margin-right:.4rem}
.sb.c .g{font-size:.78rem}
.matches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.matches{grid-template-columns:1fr}}
.tabs-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:16px}

/* Bracket */
.bracket-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(96px,.78fr);column-gap:16px;min-height:620px}
.bcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.bcol h3{margin:0 0 8px;font-size:.85rem;font-weight:700;color:var(--muted);height:1.4rem}
.slots{flex:1;display:grid;grid-auto-rows:1fr;min-height:0}
.pair{display:grid;grid-template-rows:1fr 1fr;position:relative}
.pair > .sb{align-self:center;min-width:0}
.pair::after{content:"";position:absolute;right:-8px;top:25%;bottom:25%;width:8px;border:2px solid var(--line-strong);border-left:0;border-radius:0 6px 6px 0}
.pair::before{content:"";position:absolute;right:-16px;top:50%;width:8px;border-top:2px solid var(--line-strong)}
.single{display:grid;align-items:center;position:relative;min-width:0}
.single::after{content:"";position:absolute;right:-16px;top:50%;width:16px;border-top:2px solid var(--line-strong)}
.bcol:last-child .single::after{display:none}
.champ-card{align-self:center;background:var(--gold);color:#2A1E00;border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.champ-card svg{width:24px;height:24px}
.champ-card small{display:block;font-weight:700;font-size:.68rem;opacity:.8}
.champ-card strong{display:block;font-stretch:70%;font-weight:900;font-size:1.15rem;line-height:1.1;overflow-wrap:break-word}

/* ================= Mis partidos ================= */
.picker h1{font-size:clamp(2.6rem,8vw,4.6rem)}
.picker p{color:var(--muted);max-width:52ch;font-size:1.05rem;margin:10px 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:600}
.pchip:hover{border-color:var(--accent)}
.pchip .nom{font-weight:500}
.pcard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pc-main{padding:24px;display:flex;flex-direction:column;gap:6px}
.pc-main h1{font-size:clamp(2.6rem,7vw,4.2rem)}
.pc-main .sub{color:var(--muted);font-weight:600;font-size:1.1rem}
.pc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pc-table{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:grid;grid-template-columns:5rem repeat(3,minmax(0,1fr));gap:4px 8px}
.pc-table-row{display:contents}
.pc-table-row>*{padding:6px 4px}
.pc-table-h span{color:var(--muted);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.pc-table-row:not(.pc-table-h) b{font-weight:800;color:var(--muted);font-size:.92rem;align-self:center}
.pc-table-row:not(.pc-table-h) span{font-weight:850;font-stretch:80%;font-size:1.25rem;font-variant-numeric:tabular-nums;align-self:center}
.pc-table-row.cur b,.pc-table-row.cur span{color:var(--text)}
@media (max-width:480px){.pc-table{grid-template-columns:4rem repeat(3,minmax(0,1fr))}.pc-table-row:not(.pc-table-h) span{font-size:1.05rem}}
.pc-media{position:relative;background:var(--court-in);background-size:cover;background-position:center top;
  display:grid;place-items:center;aspect-ratio:3/4;min-height:320px;transition:background-color .45s}
.pc-media[style*="url"]::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--surface),transparent 32%)}
.pc-media-ph{display:grid;place-items:center;width:100%;height:100%;color:#fff;font-weight:850;font-stretch:66%;font-size:3.4rem}
.pc-media-edit{position:absolute;left:14px;right:14px;bottom:14px;z-index:1;display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:640px){.pcard{grid-template-columns:1fr}.pc-media{aspect-ratio:3/4;min-height:280px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.stat{padding:16px 18px}.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-stretch:66%;font-weight:900;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.tracks{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 20px}
.track{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 3rem;align-items:center;gap:16px;padding:16px 0}
.track + .track{border-top:1px solid var(--line)}
.track .tname{font-stretch:78%;font-weight:800;font-size:1.1rem;line-height:1.1}
.track .tname small{display:block;font-stretch:100%;font-weight:600;color:var(--muted);font-size:.8rem}
.nodes{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.nodes::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:8px;height:3px;background:var(--line)}
.nodes .fillbar{position:absolute;left:calc(100%/12);top:8px;height:3px;background:var(--win);width:var(--w)}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:.72rem;color:var(--muted);font-weight:600}
.node i{width:19px;height:19px;border-radius:50%;background:var(--surface);border:3px solid var(--line-strong);display:block}
.node.on i{background:var(--win);border-color:var(--win)}
.node.on{color:var(--text)}
.node.out i{background:var(--surface);border-color:var(--loss)}
.node.out{color:var(--loss)}
.node.champ i{background:var(--gold);border-color:var(--gold)}
.track.skip .nodes{opacity:.35}
@media (max-width:560px){.track{grid-template-columns:1fr 3rem}.track .nodes{grid-column:1/-1;grid-row:2}.node{font-size:.62rem}}
.mlist{display:flex;flex-direction:column;gap:10px}
.mmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:5px;padding:0 2px}
.res-w{color:var(--win);font-weight:800}.res-l{color:var(--loss);font-weight:800}

/* ================= Fotos ================= */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:150px;grid-auto-flow:dense;gap:8px}
.ph{border:0;border-radius:8px;cursor:pointer;position:relative;overflow:hidden;padding:0;display:grid;place-items:center;color:rgba(251,248,241,.9);background:var(--court-in)}
.ph.big{grid-column:span 2;grid-row:span 2}.ph.tall{grid-row:span 2}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.empty-ph::before{content:"";position:absolute;inset:18% 12%;border:2px solid rgba(251,248,241,.35)}
.ph.empty-ph::after{content:"";position:absolute;left:50%;top:18%;bottom:18%;border-left:2px solid rgba(251,248,241,.35)}
.ph span{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.85rem}
.v1{background:color-mix(in srgb,var(--court-in) 80%,#000)}.v2{background:color-mix(in srgb,var(--court-out) 75%,#fff)}
.v3{background:color-mix(in srgb,var(--court-in) 65%,#000)}.v4{background:color-mix(in srgb,var(--accent) 70%,#000)}
dialog.lb{border:0;padding:0;background:transparent;max-width:min(92vw,980px);width:100%;color:var(--chalk)}
dialog.lb::backdrop{background:rgba(5,10,8,.88)}
.lb-fig{margin:0;border-radius:10px;overflow:hidden;background:var(--court-in);min-height:40vh;display:grid;place-items:center;position:relative}
.lb-fig img{display:block;max-width:100%;max-height:78vh;margin:0 auto}
.lb-fig span{font-weight:800;font-size:1.3rem}
.lb-bar{display:flex;align-items:center;gap:10px;margin-top:12px}
.lb-bar button{background:rgba(251,248,241,.14);border:0;border-radius:8px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--chalk)}
.lb-bar .count{margin-right:auto;font-weight:600}
.sv-box{max-height:80vh;overflow:auto;border-radius:10px;background:#fff}
.sv-box img{display:block;width:100%;height:auto;cursor:zoom-in}
.sv-box.zoom img{width:220%;max-width:none;cursor:zoom-out}

/* ================= Admin ================= */
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
.login h1{font-size:2.4rem;margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 18px}
.err{color:var(--loss);font-weight:700;font-size:.9rem;margin-top:10px}
.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea,.cell input,.cell select{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:500;font-size:.95rem;color:var(--text);width:100%}
.f textarea{min-height:110px;resize:vertical;line-height:1.45}
.admin-tabs{margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.panel h2{font-stretch:75%;font-weight:850;font-size:1.4rem;margin:0}
.panel .hint{color:var(--muted);font-size:.88rem;margin:-10px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.block{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.block-head{display:flex;align-items:center;gap:8px}
.block-head strong{margin-right:auto;font-stretch:80%;font-size:1.1rem}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.del{color:var(--loss)}
.icon-btn svg.i{width:17px;height:17px}
.etable{width:100%;border-collapse:collapse;min-width:640px}
.etable th{font-size:.75rem;color:var(--muted);text-align:left;padding:6px 4px;font-weight:700}
.etable td{padding:4px}
.cell input,.cell select{padding:6px 8px;font-size:.9rem}
.save-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px;
  background:var(--topbar);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.save-bar span{margin-right:auto;color:var(--muted);font-size:.85rem}
@media (max-width:900px){.save-bar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.photo-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.photo-admin .pa{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pa .pa-img{aspect-ratio:4/3;background:var(--court-in);position:relative;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem}
.pa .pa-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pa .pa-body{padding:8px;display:flex;gap:6px;align-items:center}
.pa .pa-body input{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:5px 7px;font-size:.85rem}
.preview-img{max-width:320px;border-radius:8px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Singles/Dobles y Hombres/Damas van siempre en una segunda fila del encabezado */
.topbar .wrap{flex-wrap:wrap;height:auto;row-gap:0}
.topbar .wrap > .brand,.topbar .wrap > .nav,.topbar .wrap > .swatches,.topbar .wrap > .theme-btn{margin-top:11px;margin-bottom:11px}
#modslot{order:5;width:100%;padding:0 0 10px;align-items:center}
#modslot::before{content:"Ver";font-size:.8rem;font-weight:700;color:var(--muted);margin-right:2px}
.nav a[aria-current="page"]::after{bottom:-2px}
@media (max-width:720px){#modslot{justify-content:center}.topbar .wrap > *{margin-top:8px;margin-bottom:8px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ================= Portón de clubes (login) ================= */
#gateRoot{min-height:100vh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.gate-bg{position:absolute;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gate-bg .court-wrap{width:min(1200px,90vh);transform:rotate(90deg);opacity:.55;box-shadow:0 30px 70px -24px rgba(0,0,0,.6)}
.gate-wrap{position:relative;z-index:1;width:100%;max-width:560px;animation:gateIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes gateIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.gate-wrap{animation:none}}
.gate-mark{width:88px;height:88px;margin:0 auto 18px;position:relative;border-radius:22px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.gate-mark img{width:100%;height:100%;display:block}
.gate-mark::before{content:"";position:absolute;inset:-50px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 42%,transparent),transparent 72%);filter:blur(2px)}
.gate-wrap h1{font-size:clamp(2rem,6vw,2.7rem);margin:0 0 6px}
.gate-wrap>p.lede2{color:var(--muted);margin:0 0 30px;font-size:1.02rem}
.clubs-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:8px}
.clubs-grid .club-btn{width:160px}
.club-btn{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 10px;cursor:pointer;color:var(--text);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.club-btn:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 10px 22px rgba(0,0,0,.22)}
.club-btn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.club-shield{width:56px;height:56px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:850;font-stretch:70%;font-size:1.3rem;color:#fff;flex:none}
.club-shield img{width:100%;height:100%;object-fit:cover;display:block}
.club-shield.has-img{display:block;border-radius:12px;overflow:hidden;background:#fff;padding:6px;box-sizing:border-box}
.club-shield.has-img img{width:100%;height:100%;object-fit:contain;display:block}
.club-btn .club-shield{width:120px;height:120px;font-size:2.4rem}
.club-btn{padding:14px 12px}
.club-btn span{font-weight:700;font-size:.88rem;line-height:1.2;word-break:break-word}
.gate-empty{color:var(--muted);padding:26px 10px}
.gate-pass{max-width:280px;margin:22px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;
  animation:gpIn .28s ease both}
@keyframes gpIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.gate-pass{animation:none}}
.gate-pass .club-shield{width:96px;height:96px;font-size:2rem}
.gate-pass strong{font-size:1.15rem}
.gate-pass input{width:100%;text-align:center;letter-spacing:.35em;font-size:1.3rem;font-weight:800;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);border-radius:8px;padding:10px;font-variant-numeric:tabular-nums}
.gate-pass input::placeholder{font-size:.95rem;font-weight:500;letter-spacing:normal}
.gate-pass .btnrow{display:flex;gap:8px;width:100%}
.gate-pass .btnrow .btn{flex:1}
.gate-player{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:8px}
.gate-player .btn{min-width:180px;padding:11px 22px}
.gate-player .btn.ghost{box-shadow:none;background:none;color:var(--muted);min-width:0;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.gate-player .btn.ghost:hover{color:var(--text);background:none}
.gate-player p{margin:0;font-size:.82rem;color:var(--muted);max-width:320px}
.gate-controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:28px}
.gate-admin-link{display:inline-block;margin-top:14px;font-size:.78rem;color:var(--muted);text-decoration:underline;text-underline-offset:3px;background:none;border:0;cursor:pointer;font-weight:600}
.gate-admin-link:hover{color:var(--text)}
.clubadmin-list{display:flex;flex-direction:column;gap:10px}
.clubadmin-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.clubadmin-row .club-shield{width:36px;height:36px;font-size:.85rem}
.clubadmin-row .cn{font-weight:700;font-size:.92rem;text-align:left}
.club-banner{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 12px;font-size:.9rem;margin:0 0 4px}
.club-banner .cb-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.bk-list{display:flex;flex-direction:column;gap:8px}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bk-i{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.bk-i b{font-size:.88rem}
.bk-i em{font-style:normal;font-size:.78rem;opacity:.7}
.rescue-row{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;text-align:left}
.rescue-row .rr-head{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.rescue-row .rr-sum{font-size:.8rem;margin:2px 0 8px}
.rescue-row .rr-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rescue-row select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:.85rem}
.danger-txt{color:#cf4a3a;border-color:rgba(207,74,58,.4)}
.sync-state{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted);margin-top:10px}
.sync-state .sd{width:9px;height:9px;border-radius:50%;background:#9aa0a6;flex:none;transition:background .2s}
.sync-state[data-s="ok"] .sd{background:#27a25b}
.sync-state[data-s="sync"] .sd{background:#e0a32e;animation:sdp 1s infinite}
.sync-state[data-s="err"] .sd{background:#cf4a3a}
.sync-state[data-s="off"] .sd{background:#9aa0a6}
@keyframes sdp{50%{opacity:.25}}
.sync-state.mini{margin:0 6px 0 0}
.sync-state.mini .st{display:none}
@media(min-width:760px){.sync-state.mini .st{display:inline}}
.cloud-warn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-left:3px solid #e0a32e;border-radius:10px;padding:9px 12px;font-size:.88rem;margin:0 0 10px}
.exit-btn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.exit-btn:hover{color:var(--text);border-color:var(--line-strong)}

/* ================= Compartir, inscribirse, carga rápida, modo pantalla ================= */
.btn.wa{background:#1FA855;color:#fff}
.btn.wa:hover{background:#178A45}
.tinscribe{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:-4px 0 16px}
.tinscribe small{color:var(--muted)}
dialog.sheet{border:0;padding:0;background:var(--surface);color:var(--text);border-radius:16px;width:min(92vw,440px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
dialog.sheet::backdrop{background:rgba(5,10,8,.72)}
.sheet-in{display:flex;flex-direction:column;gap:14px;padding:24px}
.sheet-in h2{font-stretch:66%;font-weight:900;font-size:2.4rem;line-height:.95;margin:0}
.sheet-in .sub{margin:-8px 0 0;color:var(--muted)}
.sheet-in .hint{margin:0;color:var(--muted);font-size:.85rem}
.sheet-in .f input,.sheet-in .f select{padding:12px;font-size:1rem}
.sheet-btns{display:flex;gap:10px}
.sheet-btns .btn{flex:1;padding:13px 16px}

/* Carga de resultados, un partido por pantalla */
.seg .cnt{opacity:.65;font-size:.78em;margin-left:2px}
.mcard{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mc-count{font-stretch:80%;font-weight:800;font-size:1.15rem}
.mcard .f input{font-size:1.05rem;padding:12px}
.mc-name.win input{border-color:var(--ball);box-shadow:0 0 0 1px var(--ball) inset}
.mc-swap{align-self:center}
.sc-heads,.sc-row{display:grid;grid-template-columns:4rem minmax(0,1fr) 1rem minmax(0,1fr);gap:8px;align-items:center}
.sc-heads{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center}
.sc-heads span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-grid{display:grid;gap:8px}
.sc-lab{color:var(--muted);font-weight:700;font-size:.85rem}
.sc-dash{text-align:center;color:var(--muted);font-weight:800}
.sc-row input{width:100%;text-align:center;font-size:1.7rem;font-weight:800;padding:10px 4px;border:1px solid var(--line-strong);background:var(--bg);border-radius:10px;color:var(--text);-moz-appearance:textfield}
.sc-row input::-webkit-outer-spin-button,.sc-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.mc-flags{display:flex;gap:8px;flex-wrap:wrap}
.mc-nav,.mc-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard .btn{padding:14px 16px;font-size:1rem}
.mcard .btn:disabled{opacity:.4;cursor:default}

/* Modo pantalla del club */
html[data-screen="1"]{font-size:clamp(14px,1.05vw,44px)}
html[data-screen="1"] body{font-size:1rem}
html[data-screen="1"] .topbar,html[data-screen="1"] .tabbar,html[data-screen="1"] #adminbar{display:none}
html[data-screen="1"] .wrap{max-width:none}
.scr{min-height:100vh;display:flex;flex-direction:column;gap:1rem;padding:1.2rem 2.2vw 1rem}
.scr-head{display:flex;align-items:center;gap:1.1rem}
.scr-head .club-shield{flex:none;width:3.6rem;height:3.6rem;font-size:1.2rem}
.scr-head h1{margin:0;font-stretch:66%;font-weight:900;font-size:clamp(2rem,3.2vw,4.2rem);line-height:.92}
.scr-head .sub{margin:.3rem 0 0;color:var(--muted);font-size:1.15rem}
.scr-clock{margin-left:auto;font-stretch:70%;font-weight:850;font-size:2.2rem;font-variant-numeric:tabular-nums}
.scr-body{flex:1;min-height:0;animation:scrIn .5s ease both}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.scr .bracket{min-height:calc(100vh - 13rem)}

<script>
/* Sincroniza superficie y tema ni bien arranca, antes de dibujar el portón (que se dibuja
   antes de que existan "store" y "state"), para que los selectores del portón ya muestren
   la elección guardada y no un valor por defecto. */
(function(){
  try{ const s=localStorage.getItem("liga:surface"); if(s) document.documentElement.dataset.surface=s; }catch(e){}
  try{
    const t=localStorage.getItem("liga:theme");
    document.documentElement.dataset.mode = (t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  }catch(e){}
})();

/* =====================================================================
   DATOS POR DEFECTO (todo esto se puede editar desde "Ingreso administrador")
   ===================================================================== */
const ADMIN_PASS = "100";

/* =====================================================================
   SINCRONIZACION EN LA NUBE (Firebase / Firestore)
   ---------------------------------------------------------------------
   Pega aca los datos del proyecto de Firebase. Mientras projectId este
   vacio, la app funciona igual que siempre, solo con este navegador.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDnMvhfeYD_fBoPvpNloi2UUeHgIza-xJs",
  authDomain: "torneotenis-fcda0.firebaseapp.com",
  projectId: "torneotenis-fcda0",
  storageBucket: "torneotenis-fcda0.firebasestorage.app",
  messagingSenderId: "245986642738",
  appId: "1:245986642738:web:4c902e38dcd8b257b6e52b"
};
/* Cada club se guarda en Firestore asi:
     clubes/{idClub}            -> { nombre, escudo, clave, parts, rev, updatedAt }
     clubes/{idClub}/data/p0..N -> { s: "pedazo del JSON" }
   Se parte en pedazos porque un documento de Firestore no puede pasar 1 MB
   y las fotos pesan. Cada club es un documento aparte: sigue todo separado. */
const CHUNK = 400000;
let fdb = null, cloudOK = false, cloudErr = "", applyingCloud = false;
let unsubClubes = null, unsubData = null, pendingCloudRev = null;
let deletingClubIds = new Set(); // clubes que se estan borrando en la nube: no resucitarlos si llega un snapshot viejo

/* Links compartidos: ?c=<club>&m=<modalidad>&g=<género>&y=<año>&k=<categoría>&r=<ronda>#<sección>.
   Quien abre el link entra directo al club como jugador (solo lectura) y cae en esa sección. */
const LINK = (()=>{ try{ const q=new URLSearchParams(location.search), c=q.get("c"); if(!c) return null;
  return {c, m:q.get("m")||"", g:q.get("g")||"", y:q.get("y")||"", k:q.get("k")||"", r:q.get("r")||"", hash:location.hash||""}; }catch(e){ return null; } })();
let linkPending = !!LINK, linkApply = null, linkRound = null;


function setSync(estado, texto){
  ["syncStateGate","syncStateApp"].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    el.dataset.s = estado; const t = el.querySelector(".st"); if(t) t.textContent = texto;
    el.title = texto;
  });
}
const cloudOn = () => cloudOK && fdb;

async function cloudInit(){
  if(!FIREBASE_CONFIG.projectId){ setSync("off","Solo en este dispositivo"); return; }
  if(typeof firebase === "undefined"){ setSync("err","Sin conexion"); return; }
  try{
    setSync("sync","Conectando...");
    firebase.initializeApp(FIREBASE_CONFIG);
    fdb = firebase.firestore();
    try{ await firebase.auth().signInAnonymously(); }catch(e){ /* si las reglas son abiertas, sigue igual */ }
    cloudOK = true;
    setSync("ok","Sincronizado");
    cloudWatchClubes();
  }catch(e){ cloudErr = String(e && e.message || e); cloudOK = false; setSync("err","Sin sincronizacion"); }
}

/* ---- Lista de clubes: se mantiene igual en todos los dispositivos ---- */
function cloudWatchClubes(){
  if(!cloudOn()) return;
  if(unsubClubes) { try{ unsubClubes(); }catch(e){} }
  unsubClubes = fdb.collection("clubes").onSnapshot(snap=>{
    let locales = []; try{ locales = JSON.parse(localStorage.getItem("liga_clubes")||"[]"); }catch(e){}
    const localPorId = new Map(locales.map(c=>[c.id,c]));
    const remotos = [], aReparar = [];
    snap.forEach(d=>{
      if(deletingClubIds.has(d.id)) return; // se esta borrando: ignorar aunque el snapshot todavia lo tenga
      const v=d.data()||{}, l=localPorId.get(d.id)||null;
      /* El documento del club en la nube puede existir SIN nombre/escudo/clave (por ejemplo, lo crea
         la subida de datos cuando la subida del club fallo, como pasa con un escudo muy pesado).
         Antes eso pisaba los datos locales con "Club" y sin escudo. Ahora lo que falta en la nube
         se completa con lo que ya hay en este dispositivo, y se reintenta subir el club. */
      const club = {id:d.id,
        nombre: v.nombre || (l&&l.nombre) || "Club",
        escudo: ("escudo" in v) ? (v.escudo||"") : ((l&&l.escudo)||""),
        clave: String(v.clave || (l&&l.clave) || "")};
      remotos.push(club);
      if(l && (l.nombre||l.escudo||l.clave) && (!v.nombre || !("escudo" in v) || !v.clave)) aReparar.push(club);
    });
    /* No pisar clubes que existen en este dispositivo pero todavia no llegaron a la nube
       (recien creados, o creados mientras la nube estaba desconectada): si los sacamos
       aca, parecen "borrados" apenas se agregan. Se mantienen localmente y se reintenta subirlos. */
    const remotoIds = new Set(remotos.map(c=>c.id));
    const soloLocales = locales.filter(c=>!remotoIds.has(c.id) && !deletingClubIds.has(c.id));
    const fusion = remotos.concat(soloLocales);
    applyingCloud = true;
    try{ localStorage.setItem("liga_clubes", JSON.stringify(fusion)); }catch(e){}
    applyingCloud = false;
    if(soloLocales.length) soloLocales.forEach(c=>cloudPushClub(c)); // reintento de subida
    aReparar.forEach(c=>cloudPushClub(c)); // completa en la nube lo que le faltaba al club
    if(linkPending) tryDeepLink(); // link compartido: en un celular nuevo el club recién aparece ahora
    if(document.getElementById("gateRoot").style.display !== "none") renderGate();
    if(CLUB_ID){ const c = remotos.find(x=>x.id===CLUB_ID);
      const lab = document.getElementById("clubCityLabel"); if(c && lab) lab.textContent = c.nombre; }
    setSync("ok","Sincronizado");
  }, err=>{ cloudErr=String(err&&err.message||err); setSync("err","Error de sincronizacion"); });
}
async function cloudPushClub(c){
  if(!cloudOn() || applyingCloud) return;
  try{ setSync("sync","Subiendo...");
    await fdb.collection("clubes").doc(c.id).set({nombre:c.nombre, escudo:c.escudo||"", clave:String(c.clave||""), updatedAt:Date.now()},{merge:true});
    setSync("ok","Sincronizado");
  }catch(e){ cloudErr=String(e&&e.message||e); setSync("err","No se pudo subir el club"); toast("No se pudo subir el club a la nube. Si el escudo es muy pesado, volvé a elegirlo."); }
}
async function cloudDeleteClub(id){
  if(!cloudOn()) return;
  deletingClubIds.add(id);
  try{
    const col = fdb.collection("clubes").doc(id).collection("data");
    const docs = await col.get();
    const bs = fdb.batch(); docs.forEach(d=>bs.delete(d.ref)); bs.delete(fdb.collection("clubes").doc(id));
    await bs.commit();
  }catch(e){ setSync("err","No se pudo borrar en la nube"); }
  finally{ deletingClubIds.delete(id); }
}

/* ---- Datos de un club (torneos, ranking, fotos...) ---- */
const revLocal = id => { try{ return localStorage.getItem(ck(id,"rev"))||""; }catch(e){ return ""; } };
async function cloudPushData(id){
  if(!cloudOn() || applyingCloud || !id) return false;
  try{
    setSync("sync","Subiendo...");
    const json = JSON.stringify(data);
    const trozos = []; for(let i=0;i<json.length;i+=CHUNK) trozos.push(json.slice(i,i+CHUNK));
    const col = fdb.collection("clubes").doc(id).collection("data");
    for(let i=0;i<trozos.length;i+=4){
      await Promise.all(trozos.slice(i,i+4).map((sx,j)=>col.doc("p"+(i+j)).set({s:sx})));
    }
    let previas = 0; try{ previas = +(localStorage.getItem(ck(id,"parts"))||0); }catch(e){}
    for(let i=trozos.length;i<previas;i++){ try{ await col.doc("p"+i).delete(); }catch(e){} }
    const rev = String(Date.now())+"-"+Math.random().toString(36).slice(2,7);
    await fdb.collection("clubes").doc(id).set({parts:trozos.length, rev, updatedAt:Date.now()},{merge:true});
    try{ localStorage.setItem(ck(id,"rev"),rev); localStorage.setItem(ck(id,"parts"),String(trozos.length)); }catch(e){}
    setSync("ok","Sincronizado");
    return true;
  }catch(e){ setSync("err","No se pudo subir"); return false; }
}
async function cloudPullData(id){
  if(!cloudOn() || !id) return false;
  try{
    setSync("sync","Bajando...");
    const snap = await fdb.collection("clubes").doc(id).get();
    const meta = snap.exists ? snap.data() : null;
    if(!meta || !meta.parts){ setSync("ok","Sincronizado"); return false; }
    const col = fdb.collection("clubes").doc(id).collection("data");
    const docs = await Promise.all(Array.from({length:meta.parts},(_,i)=>col.doc("p"+i).get()));
    const json = docs.map(d=>d.exists?(d.data().s||""):"").join("");
    const obj = JSON.parse(json);
    try{
      localStorage.setItem(ck(id,"data5"), JSON.stringify(obj));
      localStorage.setItem(ck(id,"rev"), meta.rev||"");
      localStorage.setItem(ck(id,"parts"), String(meta.parts));
    }catch(e){ setSync("err","No entra en este navegador"); return false; }
    setSync("ok","Sincronizado");
    return true;
  }catch(e){ setSync("err","No se pudo bajar"); return false; }
}
const draftSucio = () => !!(state && state.draft && JSON.stringify(state.draft)!==JSON.stringify(data));
function cloudWatchData(id){
  if(!cloudOn() || !id) return;
  if(unsubData){ try{ unsubData(); }catch(e){} unsubData=null; }
  unsubData = fdb.collection("clubes").doc(id).onSnapshot(async snap=>{
    const meta = snap.exists ? snap.data() : null;
    if(!meta || !meta.rev || meta.rev===revLocal(id)) return;
    if(draftSucio()){ pendingCloudRev = meta.rev; render(); return; } // hay cambios sin guardar: avisa y no pisa nada
    if(await cloudPullData(id) && CLUB_ID===id){
      loadClubState();
      if(state.admin) state.draft = clone(data);
      pendingCloudRev = null;
      render(); toast("Se actualizo con los cambios de otro dispositivo");
    }
  }, err=>setSync("err","Error de sincronizacion"));
}
function cloudUnwatchData(){ if(unsubData){ try{ unsubData(); }catch(e){} unsubData=null; } pendingCloudRev=null; }
async function cloudAcceptPending(){
  if(!CLUB_ID) return;
  if(await cloudPullData(CLUB_ID)){ loadClubState(); if(state.admin) state.draft=clone(data); pendingCloudRev=null; render(); toast("Datos actualizados desde la nube"); }
}
/* Primera vez en un dispositivo nuevo: si el club no tiene nada local pero si en la nube, baja.
   Si tiene algo local mas nuevo que la nube, sube. */
async function cloudSyncClub(id){
  if(!cloudOn() || !id) return;
  try{
    const snap = await fdb.collection("clubes").doc(id).get();
    const meta = snap.exists ? snap.data() : null;
    const hayLocal = !!localStorage.getItem(ck(id,"data5"));
    if(meta && meta.rev && meta.rev!==revLocal(id) && (!hayLocal || !draftSucio())){
      if(await cloudPullData(id) && CLUB_ID===id){ loadClubState(); if(state.admin) state.draft=clone(data); render(); }
    } else if(hayLocal && (!meta || !meta.parts)){
      await cloudPushData(id);
    }
  }catch(e){}
}

/* ================= Utilidades compartidas (portón + app) ================= */
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }
const I = {
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

const CLUB_COLORS = ["#D0652F","#3C86DB","#8457C2","#1F8A55","#B8522A","#2D66A3","#C98452","#6C43A6"];
function clubColor(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return CLUB_COLORS[h%CLUB_COLORS.length]; }
function initials(nombre){ return String(nombre||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"?"; }
function shieldHTML(c){ return c.escudo ? `<img src="${esc(c.escudo)}" alt="">` : initials(c.nombre); }
function shieldAttrs(c){ return c.escudo ? `class="club-shield has-img"` : `class="club-shield" style="background:${clubColor(c.id)}"`; }

  get(){ try{ return JSON.parse(localStorage.getItem("liga_clubes")||"[]"); }catch(e){ return []; } },
  set(arr){ try{ localStorage.setItem("liga_clubes", JSON.stringify(arr)); if(!applyingCloud) arr.forEach(c=>cloudPushClub(c)); return true; }catch(e){ toast("No se pudo guardar: el navegador se quedó sin espacio."); return false; } }
};

    store.set("mod",L.m); store.set("genero",L.g); state.mod=L.m; state.genero=L.g; state.profile=loadProfile(genKey());
  }
  if(L.y){ store.set("anio",L.y); state.anio=L.y; }
  if(L.k){ store.set("cat",L.k); state.cat=L.k; } // si todavía no bajaron los datos, se valida al dibujar
  if(L.r!=="" && Number.isFinite(+L.r) && /^#resultados/.test(L.hash)) linkRound=Math.max(0,+L.r);
}

/* ---- Rescate de datos: busca en el navegador todos los bloques de informacion guardados
   (los de cada club y los que quedaron del espacio viejo, sin club) y permite copiarlos
   al club que corresponda. Sirve para recuperar datos que quedaron "sueltos". ---- */
function blobResumen(json){
  try{
    const o = JSON.parse(json);
    const mods = o.modalidades||{};
    let tor=0, jug=0;
    Object.values(mods).forEach(m=>{ tor += (m.torneos||[]).length;
      Object.values(m.ranking||{}).forEach(rows=>{ jug += (rows||[]).length; }); });
    const fotos=(o.fotos||[]).length, nov=(o.novedades||[]).length;
    return `${tor} torneo${tor===1?"":"s"} · ${jug} jugador${jug===1?"":"es"} · ${fotos} foto${fotos===1?"":"s"} · ${nov} novedad${nov===1?"":"es"}`;
  }catch(e){ return "no se pudo leer"; }
}
function scanBlobs(){
  const out=[]; const clubes=clubStore.get();
  let keys=[]; try{ keys=Object.keys(localStorage); }catch(e){ return out; }
  keys.forEach(k=>{
    let origen=null, id=null, ver=null;
    const mc = k.match(/^liga:c:([^:]+):(data5|data4|data3)$/);
    if(mc){ id=mc[1]; ver=mc[2]; const c=clubes.find(x=>x.id===id);
      origen = c ? ("Club: "+c.nombre) : ("Club borrado ("+id+")"); }
    else if(/^liga:(data5|data4|data3)$/.test(k)){ origen="Espacio viejo (sin club)"; ver=k.split(":")[1]; }
    else if(/^liga:nocl:(data5|data4|data3)$/.test(k)){ origen="Guardado sin club abierto"; ver=k.split(":")[2]; }
    if(!origen) return;
    let v=null; try{ v=localStorage.getItem(k); }catch(e){}
    if(!v) return;
    out.push({key:k, club:id, origen, ver, vieja:ver!=="data5", kb:Math.round(v.length/1024), resumen:blobResumen(v)});
  });
  return out.sort((a,b)=>b.kb-a.kb);
}
function copiarBlobAClub(key, destino){
  let v=null; try{ v=localStorage.getItem(key); }catch(e){}
  if(!v){ toast("Ese bloque ya no está"); return false; }
  let obj; try{ obj=migrate(JSON.parse(v)); }catch(e){ toast("El bloque está dañado"); return false; }
  const destKey = "liga:c:"+destino+":data5";
  try{
    const prev = localStorage.getItem(destKey);
    if(prev){
      if(!confirm("Ese club ya tiene informacion cargada. Se reemplaza por este bloque (se guarda una copia antes). ¿Seguir?")) return false;
      const bkKey="liga:c:"+destino+":bk";
      let arr=[]; try{ arr=JSON.parse(localStorage.getItem(bkKey)||"[]"); }catch(e){}
      arr.unshift({ts:Date.now(),motivo:"Antes de recuperar datos",json:prev});
      try{ localStorage.setItem(bkKey, JSON.stringify(arr.slice(0,BK_MAX))); }catch(e){}
    }
    localStorage.setItem(destKey, JSON.stringify(obj));
  }catch(e){ toast("No entra: el navegador se quedó sin espacio"); return false; }
  toast("Datos copiados al club");
  return true;
}
function eliminarBlob(key){
  try{ localStorage.removeItem(key); }catch(e){ toast("No se pudo eliminar"); return false; }
  toast("Bloque eliminado");
  return true;
}
function bajarJSON(nombre, obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre;
  document.body.appendChild(a); a.click(); a.remove();
}

function renderRescue(){

  cont.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:8px">

  cont.querySelectorAll("[data-rcopy]").forEach(btn=>btn.onclick=()=>{

    const b=blobs[+btn.getAttribute("data-rdown")];

  });

    if(!confirm(`¿Eliminar los ${blobs.length} bloques sueltos listados? No se puede deshacer. Los clubes activos no se tocan.`)) return;
    blobs.forEach(b=>eliminarBlob(b.key));
    renderRescue();
  };
}

/* Los selectores de superficie del portón: no dependen de "state" ni de "store" (todavía no

const clone = o => JSON.parse(JSON.stringify(o));
function migrate(o){ // convierte datos de versiones anteriores al esquema actual (con género)
  if(o.modalidades){
    const yaTieneGenero=Object.keys(o.modalidades).some(k=>k.includes("-"));
    if(yaTieneGenero) return o;
    const d=clone(DEFAULT_DATA);
    if(o.info){ d.info=o.info; d.info.horarios=(o.info.horarios||[]).map(h=>{ const old=h.mod||"singles";
      return {...h,mod:(old==="singles"||old==="dobles")?`${old}-hombres`:old}; }); }
    if(o.novedades) d.novedades=o.novedades;
    if(o.fotos) d.fotos=o.fotos;
    ["singles","dobles"].forEach(mod=>{ if(o.modalidades[mod]) d.modalidades[`${mod}-hombres`]=o.modalidades[mod]; });
    return d;
  }
  const d=clone(DEFAULT_DATA);
  if(o.info){ d.info=o.info; d.info.horarios=(o.info.horarios||[]).map(h=>({mod:"singles-hombres",...h})); }
  if(o.novedades) d.novedades=o.novedades;
  if(o.fotos) d.fotos=o.fotos;
  if(o.torneos&&o.ranking){
    const ids=Object.keys(o.ranking);
    d.modalidades["singles-hombres"]={categorias:ids.map(id=>({id,nombre:id})),
      torneos:o.torneos.map(t=>{const f={}; ids.forEach(id=>f[id]=t[id]||{champ:"",fin:""}); const {B,C,...rest}=t; return {...rest,finales:f};}),
      ranking:o.ranking,resultados:o.resultados||{}};
  }
  return d;
}
function normalize(d){ // asegura que cada torneo tenga año (lo toma del nombre o las fechas si falta)
  d.jugadores = (d.jugadores&&typeof d.jugadores==="object") ? d.jugadores : {};
  { const c=(d.club&&typeof d.club==="object")?d.club:{}, r=(c.redes&&typeof c.redes==="object")?c.redes:{};
    d.club={ direccion:String(c.direccion||"").trim(), mapa:String(c.mapa||"").trim(),
      redes:Object.fromEntries(Object.keys(DEFAULT_DATA.club.redes).map(k=>[k,String(r[k]||"").trim()])) }; }
  Object.values(d.modalidades||{}).forEach(m=>(m.torneos||[]).forEach(t=>{
    if(t.anio==null||t.anio===""){ const mm=String(t.nombre||"").match(/20\d\d/)||String(t.fechas||"").match(/20\d\d/); t.anio=mm?mm[0]:String(new Date().getFullYear()); }
    t.anio=String(t.anio);
  }));
  // puntos válidos: de 16avos (10) a campeón (100); en torneos de 2025 o antes también la ronda previa (5).
  // Cualquier otro valor cuenta como "no jugó".
  const OK=[10,20,40,60,80,100];
  Object.values(d.modalidades||{}).forEach(m=>Object.values(m.ranking||{}).forEach(rows=>rows.forEach(r=>{
    for(let k=1;k<r.length;k++){ const v=r[k], t=(m.torneos||[])[k-1];
      if(v!=null&&v!==""&&!OK.includes(+v)&&!(+v===5&&t&&allows5(t))) r[k]=null; }
  })));
  return d;
}

function parseScore(str){
  if(str==null||str==="") return null;
  let t=String(str).trim().toUpperCase().replace(/\./g,"");
  if(t==="WO") return "WO";
  let ret=false;
  if(/(^|\s)(Y\s+)?(RET|RETIRO|ABANDONO)$/.test(t)){ ret=true; t=t.replace(/(^|\s)(Y\s+)?(RET|RETIRO|ABANDONO)$/,"").trim(); }
  const sets=t?t.split(/\s+/).map(x=>x.split("-").map(Number)):[];
  if(!sets.every(s=>s.length===2&&s.every(Number.isFinite))) return null;
  if(ret) sets.ret=true; else if(!sets.length) return null;
  return sets;
}
const flip = sets => { const f=sets.map(([a,b])=>[b,a]); if(sets.ret) f.ret=true; return f; };

function ranked(cat,m=M(),allYears=false){ // posiciones sin empates: manda el total y, si empatan, el orden de la lista
  const ks=m.torneos.map((t,k)=>({t,k})).filter(x=>(allYears||inYear(x.t))&&applies(x.t,cat)).map(x=>x.k);
  const y=curYear(), ord=(!allYears&&y!=="todos"&&m.desempate&&m.desempate[y]&&m.desempate[y][cat])||null;
  const tb=(name,i)=>{ if(!ord) return i; const k=ord.indexOf(name); return k<0?1e6+i:k; };
  const has=v=>v!=null&&v!=="";
  return (m.ranking[cat]||[]).map((r,i)=>({name:r[0],pts:r.slice(1),i,total:ks.reduce((a,k)=>a+(+r[k+1]||0),0),
      played:ks.some(k=>has(r[k+1])),ever:r.slice(1).some(has),tb:tb(r[0],i)}))
    .filter(r=>allYears||curYear()==="todos"?r.ever||!r.pts.length:r.played)
    .sort((a,b)=>b.total-a.total||a.tb-b.tb).map((r,k)=>({...r,pos:k+1}));
}

function roundsOf(tid,cat){ const r=M().resultados[tid]; return (r&&r[cat])||[]; }
function playerMatches(name,allYears=false){
  const out=[];
  M().torneos.filter(t=>allYears||inYear(t)).forEach(t=>tourCats(t).forEach(c=>roundsOf(t.id,c.id).forEach(r=>r.m.forEach(m=>{
    const a=m[0]===name||inTeam(m[0],name), b=m[1]===name||inTeam(m[1],name);
    if(!a&&!b) return;
    const sc=parseScore(m[2]), won=a, mine=won?m[0]:m[1];
    const partner=isTeam(mine)?teamParts(mine).filter(p=>p!==name&&p!==split(name).ap).map(p=>split(p).ap).join(" / "):"";
    out.push({torneo:t.nombre,cat:c.id,round:r.name,mine,partner,opp:won?m[1]:m[0],won,sets:sc==="WO"?"WO":sc?(won?sc:flip(sc)):null});
  }))));
  return out;
}
/* Cara a cara: historial contra cada rival, sumando todos los años de esta modalidad.
   En dobles cuenta cada rival por separado (los dos del otro lado de la red). */
function h2hOf(name){
  const roster=[...new Set(Object.values(M().ranking).flat().map(r=>r[0]))];
  const canon=p=>{ if(roster.includes(p)) return p; const c=roster.filter(n=>split(n).ap===p); return c.length===1?c[0]:p; };
  const mio=t=>t===name||inTeam(t,name), rivals=new Map();
  orderedTours().forEach(t=>tourCats(t).forEach(c=>roundsOf(t.id,c.id).forEach(r=>r.m.forEach(m=>{
    if(!m[0]||!m[1]) return;
    const a=mio(m[0]), b=mio(m[1]); if(a===b) return;
    const sc=parseScore(m[2]), won=a, mine=won?m[0]:m[1], opp=won?m[1]:m[0];
    const partner=isTeam(mine)?teamParts(mine).filter(p=>p!==name&&p!==split(name).ap).map(p=>split(p).ap).join(" / "):"";
    const it={torneo:t.nombre,anio:t.anio,round:r.name,mine,opp,partner,won,sets:sc==="WO"?"WO":sc?(won?sc:flip(sc)):null};
    (isTeam(opp)?teamParts(opp):[opp]).forEach(p=>{
      const k=canon(p); if(k===name) return;
      if(!rivals.has(k)) rivals.set(k,{name:k,w:0,l:0,ms:[]});
      const e=rivals.get(k); won?e.w++:e.l++; e.ms.push(it);
    });
  }))));
  return [...rivals.values()].map(e=>({...e,known:roster.includes(e.name)})).sort((x,y)=>(y.w+y.l)-(x.w+x.l)||y.w-x.w||x.name.localeCompare(y.name));
}
function h2hHTML(name){
  const rs=h2hOf(name); if(!rs.length) return "";
  return `<h2 class="round-label">Cara a cara</h2><p class="h2h-note">Historial contra cada rival, sumando todos los años. Tocá uno para ver los partidos.</p>
    <div class="h2h-list">${rs.map(r=>`<details class="h2h"><summary><span class="h2h-name">${nameHTML(r.name)}</span><span class="h2h-rec ${r.w>r.l?"res-w":(r.w<r.l?"res-l":"")}">${r.w}-${r.l}</span></summary>
      <div class="mlist">${r.ms.slice().reverse().map(m=>`<div><div class="mmeta"><span>${esc(m.torneo)}${m.anio?" "+esc(m.anio):""}, ${esc(m.round)}${m.partner?`, con ${esc(m.partner)}`:""}</span>
        <span class="${m.won?"res-w":"res-l"}">${m.won?"Ganó":"Perdió"}</span></div>${scoreboard(m.mine,m.opp,m.sets,m.won)}</div>`).join("")}
        ${r.known?`<div><button class="btn ghost sm" data-player="${esc(r.name)}">Ver perfil</button></div>`:""}</div></details>`).join("")}</div>`;
}
// torneos en orden cronológico: por año y, dentro del año, en el orden cargado
const orderedTours = () => M().torneos.map((t,i)=>({t,i})).sort((a,b)=>String(a.t.anio||"").localeCompare(String(b.t.anio||""))||a.i-b.i).map(x=>x.t);
function lastFinishedAll(){
  const ts=orderedTours();
  for(let i=ts.length-1;i>=0;i--){ const t=ts[i]; if(t.estado==="Finalizado"&&tourCats(t).some(c=>finOf(t)[c.id]&&finOf(t)[c.id].champ)) return t; }
  return null;
}
function featuredTour(){ // el torneo que protagoniza el inicio: en juego > próximo > último finalizado
  const ts=orderedTours();
  const live=ts.filter(t=>t.estado==="En juego"); if(live.length) return live[live.length-1];
  const next=ts.filter(t=>t.estado==="Próximo"); if(next.length) return next[0];
  return lastFinishedAll();
}
function autoLede(){
  const f=featuredTour(), mod=genPhrase();
  if(!f) return `Todavía no hay torneos de ${mod}.`;
  if(f.estado==="En juego") return `Se está jugando el Torneo ${esc(f.nombre)} de ${mod}.`;
  if(f.estado==="Próximo") return `Se viene el Torneo ${esc(f.nombre)} de ${mod}.`;

function heroItems(){ // lo que se muestra sobre la cancha del inicio
  const f=featuredTour();
  if(f && f.estado!=="Finalizado") return {mode:"torneo",items:[]}; // próximo o en juego: la cancha va sin nombres
  const t=latestFinished(); if(!t) return {mode:"campeones",items:[]};
  return {mode:"campeones",items:tourCats(t).filter(c=>finOf(t)[c.id]&&finOf(t)[c.id].champ).map(c=>{ const fx=t.finales[c.id], w=dispSplit(fx.champ), l=dispSplit(fx.fin||"");

function latestFinished(){
  if(state.homeAll) return lastFinishedAll();
  const ts=M().torneos.filter(inYear);
  for(let i=ts.length-1;i>=0;i--){ const t=ts[i]; if(t.estado==="Finalizado"&&tourCats(t).some(c=>finOf(t)[c.id]&&finOf(t)[c.id].champ)) return t; }
  return null;
}

function scoreboard(a,b,sets,aWon,compact=false,short=false){
  const nm = n => esc(short ? dispSplit(n).ap : shortName(n));
  const min = compact?0:3; // en Resultados fijamos 3 columnas para que todas las líneas alineen
  let n=1,rowA="",rowB="";
  if(sets==="WO"){
    rowA = aWon?'<span class="g wo">W.O.</span>':'<span class="g"></span>';
    rowB = aWon?'<span class="g"></span>':'<span class="g wo">W.O.</span>';
  } else if(!sets){
    rowA = rowB = '<span class="g" title="Score sin cargar">–</span>';
  } else {
    n=sets.length;
    sets.forEach(([x,y])=>{ const st=Math.max(x,y)>=10?" st":"", t=st?' title="Super tie-break"':"";
      rowA+=`<span class="g${x>y?" won":""}${st}"${t}>${x}</span>`; rowB+=`<span class="g${y>x?" won":""}${st}"${t}>${y}</span>`; });
  }
  if(Array.isArray(sets)&&sets.ret){ // el que se retiró es el perdedor
    rowA+=aWon?'<span class="g"></span>':'<span class="g wo" title="Se retiró">ret.</span>';
    rowB+=aWon?'<span class="g wo" title="Se retiró">ret.</span>':'<span class="g"></span>'; n+=1; }
  if(n<min){ const pad='<span class="g pad"></span>'.repeat(min-n); rowA+=pad; rowB+=pad; n=min; }
  return `<div class="sb${compact?" c":""}" style="--n:${n}">
    <div class="sb-row${aWon?" w":""}"><span class="sb-name" title="${esc(a)}">${nm(a)}</span>${rowA}</div>
    <div class="sb-row${aWon?"":" w"}"><span class="sb-name" title="${esc(b)}">${nm(b)}</span>${rowB}</div></div>`;
}

function schedGroups(list){
  // agrupa por modalidad+género y categoría, respetando el orden de las categorías
  const groups=[];
  MODCOMBOS().forEach(([key])=>{
    const m=data.modalidades[key]; if(!m) return;
    const ids=[...m.categorias.map(c=>c.id),""];
    ids.forEach(id=>{ const items=list.filter(h=>(h.mod||"singles-hombres")===key&&(h.cat||"")===id); if(items.length) groups.push({mod:key,id,
      nombre:id?`Categoría ${(m.categorias.find(c=>c.id===id)||{nombre:id}).nombre}`:"Sin categoría",items}); });
    const known=new Set(ids); const orphan=list.filter(h=>(h.mod||"singles-hombres")===key&&!known.has(h.cat||""));
    if(orphan.length) groups.push({mod:key,id:"?",nombre:"Otras categorías",items:orphan});
  });
  return groups;
}

const REDES=[["instagram","Instagram","instagram","@usuario o link"],["facebook","Facebook","facebook","nombre de la página o link"],
  ["whatsapp","WhatsApp","whatsapp","número con código de área, ej. 5492324123456"],["tiktok","TikTok","tiktok","@usuario o link"],

function redHref(tipo,val){ // acepta @usuario, dominio o link completo; siempre devuelve https o vacío
  const v=String(val||"").trim(); if(!v) return "";
  if(/^https?:\/\//i.test(v)) return v;
  if(tipo==="whatsapp"){ const n=v.replace(/\D/g,""); return n?"https://wa.me/"+n:""; }
  if(tipo==="web") return "https://"+v.replace(/^\/+/,"");
  if(/^www\./i.test(v)||v.includes("/")) return "https://"+v.replace(/^\/+/,"");
  const u=encodeURIComponent(v.replace(/^@/,""));
  return ({instagram:"https://instagram.com/"+u,facebook:"https://facebook.com/"+u,tiktok:"https://tiktok.com/@"+u,youtube:"https://youtube.com/@"+u})[tipo]||"";
}
const GMAPS_RE=/^https?:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|goo\.gl\/maps|maps\.app\.goo\.gl)/i;
