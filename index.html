function tourHead(t,c,mode){
  const base=mode==="res"?"resultados":"cuadro";
  return `<div class="page-head"><div><h1 class="display">${esc(t.nombre)}${modNote()}</h1><p class="sub">Categoría ${esc(catName(c))} ${editLink("resultados")}</p></div>
    <div class="controls"><nav class="seg" aria-label="Vista">
      <a href="#resultados/${t.id}/${c}"${mode==="res"?' aria-current="page"':""}>Resultados</a><a href="#cuadro/${t.id}/${c}"${mode==="draw"?' aria-current="page"':""}>Cuadro</a></nav>
      <div class="scroll-x"><nav class="seg" aria-label="Categoría">${tourCats(t).map(k=>`<a href="#${base}/${t.id}/${k.id}"${c===k.id?' aria-current="page"':""}>Cat. ${esc(k.nombre)}</a>`).join("")}</nav></div>${shareBtn(mode==="res"?"res":"draw",t.id,c)}</div></div>`;
}
const noRes = t => `<div class="empty"><strong>Todavía no hay resultados cargados</strong>Cuando la organización cargue los partidos de ${esc(t.nombre)}, van a aparecer acá.<br>
  <a class="btn ghost" href="#torneos">Volver a torneos</a></div>`;
function resolveTour(tid,c){
  const ts=M().torneos; const t=ts.find(x=>x.id===tid)||ts[ts.length-1];
  if(t&&curYear()!=="todos"&&String(t.anio)!==curYear()) state.anio=String(t.anio); // el año sigue al torneo abierto
  const tc=t?tourCats(t):[]; const cid=tc.find(k=>k.id===c)?c:(tc[0]||{}).id;
  return {t,cid};
}
function vResultados(tid,c){
  const {t,cid}=resolveTour(tid,c);
  if(!t||!cid) return vTorneos();
  const rounds=roundsOf(t.id,cid).filter(r=>r.m.length);
  if(!rounds.length) return `<section class="wrap page">${tourHead(t,cid,"res")}${noRes(t)}</section>`;
  if(linkRound!=null){ state.round=linkRound; linkRound=null; }
  const r=Math.min(state.round,rounds.length-1);
  const all=rounds.map(d=>`<div data-group><h2 class="round-label">${esc(d.name)}</h2><div class="matches">${d.m.map(m=>
    `<div data-m="${esc((m[0]+" "+m[1]).toLowerCase())}">${matchSB(m)}</div>`).join("")}</div></div>`).join("");
  return `<section class="wrap page">${tourHead(t,cid,"res")}
    <div class="tabs-row"><div class="scroll-x"><div class="seg" role="group" aria-label="Ronda">${rounds.map((d,i)=>
      `<button data-round="${i}" aria-pressed="${i===r}">${esc(d.name)}</button>`).join("")}</div></div>
      <label class="search">${icon("search")}<span class="sr">Buscar</span><input id="resSearch" type="search" placeholder="Buscar ${who()}"></label></div>
    <div id="roundView"><div class="matches">${rounds[r].m.map(m=>matchSB(m)).join("")}</div></div>
    <div id="searchView" hidden>${all}</div>
    <p class="note">El punto amarillo marca al ganador. Los sets sombreados son super tie-break. Un guion indica que el score no está cargado.</p></section>`;
}
function roundsOfM(m,tid,cat){ const r=m.resultados[tid]; return (r&&r[cat])||[]; }
/* Devuelve el cuadro dibujado, o "" si todavía faltan cruces. Recibe la modalidad para poder usarse también desde el modo pantalla. */
function bracketHTML(m,t,cid){
  const all=roundsOfM(m,t.id,cid), names=["Octavos","Cuartos","Semifinal","Final"], need=[8,4,2,1];
  const rounds=names.map(n=>all.find(r=>r.name===n));
  if(!rounds.every((r,i)=>r&&r.m.length===need[i])) return "";
  const winners=[];
  const cols=rounds.map((rd,ri)=>{
    const boxes=rd.m.map((mm,mi)=>{
      let top=mm[0],bot=mm[1];
      if(ri>0){ const a=winners[ri-1][mi*2], b=winners[ri-1][mi*2+1]; if([a,b].includes(mm[0])&&[a,b].includes(mm[1])){top=a;bot=b;} }
      (winners[ri]||(winners[ri]=[]))[mi]=mm[0];
      const sc=parseScore(mm[2]), topWon=top===mm[0];
      return scoreboard(top,bot,Array.isArray(sc)&&!topWon?flip(sc):sc,topWon,true,true);
    });
    let slots=""; if(boxes.length===1) slots=`<div class="single">${boxes[0]}</div>`;
    else for(let i=0;i<boxes.length;i+=2) slots+=`<div class="pair">${boxes[i]}${boxes[i+1]}</div>`;
    return `<div class="bcol"><h3>${rd.name}</h3><div class="slots">${slots}</div></div>`;
  }).join("");
  const ch=dispSplit(rounds[3].m[0][0]);
  return `<div class="bracket-box scroll-x"><div class="bracket">${cols}
      <div class="bcol"><h3>Campeón</h3><div class="slots"><div class="single"><div class="champ-card">${icon("trophy")}
        <small>${esc(t.nombre)}, Cat. ${esc(catName(cid,m))}</small><strong>${esc(ch.ap)}</strong><small>${esc(ch.nom)}</small></div></div></div></div></div></div>`;
}
function vCuadro(tid,c){
  const {t,cid}=resolveTour(tid,c);
  if(!t||!cid) return vTorneos();
  const b=bracketHTML(M(),t,cid);
  if(!b) return `<section class="wrap page">${tourHead(t,cid,"draw")}<div class="empty"><strong>El cuadro todavía no está completo</strong>
    Para dibujarlo hacen falta todos los cruces desde octavos. Mientras tanto podés ver los partidos cargados.<br>
    <a class="btn ghost" href="#resultados/${t.id}/${cid}">Ver resultados</a></div></section>`;
  return `<section class="wrap page">${tourHead(t,cid,"draw")}
    ${b}
    <p class="note">El cuadro arranca en octavos. Los 16avos están en <a href="#resultados/${t.id}/${cid}">Resultados</a>.</p></section>`;
}

function vPartidos(){
  const name = state.picking ? "" : (state.view || state.profile);

  if(!p) return vPicker();
  const s=split(p.name), isProfile=state.profile===p.name, ms=playerMatches(p.name);
  let stats="";
  if(ms.length){
    const w=ms.filter(m=>m.won).length; let sw=0,sl=0,stw=0,stt=0;
    ms.forEach(m=>Array.isArray(m.sets)&&m.sets.forEach(([a,b])=>{a>b?sw++:sl++; if(Math.max(a,b)>=10){stt++; if(a>b)stw++;}}));
    stats=`<div class="stats"><div class="stat"><b>${w}-${ms.length-w}</b><span>partidos ganados y perdidos</span></div>
      <div class="stat"><b>${sw}-${sl}</b><span>sets ganados y perdidos</span></div>
      <div class="stat"><b>${stt?`${stw}/${stt}`:"—"}</b><span>super tie-breaks ganados</span></div>
      <div class="stat"><b>${Math.round(w/ms.length*100)}%</b><span>de partidos ganados</span></div></div>`;
  }
  const labels=["16avos","8vos","4tos","Semi","Final","Campeón"];
  const tracks=M().torneos.map((t,k)=>({t,k})).filter(x=>inYear(x.t)&&applies(x.t,p.cat)).map(({t,k})=>{
    const v=p.pts[k], idx=v==null?-1:PTS_IDX[v];

    return `<div class="track${idx<0?" skip":""}"><div class="tname">${esc(t.nombre)}<small>${idx<0?"No jugó":PTS[v]}</small></div>
      <div class="nodes"><span class="fillbar" style="--w:${w}"></span>${labels.map((l,j)=>{
        let cls=""; if(j<=idx) cls="on"; if(j===idx&&idx<5) cls="out"; if(j===5&&idx===5) cls="champ";
        return `<div class="node ${cls}"><i></i>${l}</div>`; }).join("")}</div>${pill(v)}</div>`;
  }).join("");
  const mlist = ms.length ? `<h2 class="round-label">Partidos</h2><div class="mlist">${ms.slice().reverse().map(m=>`<div><div class="mmeta"><span>${esc(m.torneo)}, ${esc(m.round)}${m.partner?`, con ${esc(m.partner)}`:""}</span>
      <span class="${m.won?"res-w":"res-l"}">${m.won?"Ganó":"Perdió"}</span></div>${scoreboard(m.mine,m.opp,m.sets,m.won)}</div>`).join("")}</div>`

  const foto = playerFoto(p.name);

  const wS=ms.filter(m=>m.won).length, wC=msCareer.filter(m=>m.won).length;
  const catTorneos = M().torneos.map((t,k)=>({t,k})).filter(x=>applies(x.t,p.cat));
  const titlesIn = list => list.filter(x=>p.pts[x.k]===100).length;
  const tRow = (label,pos,w,l,tit,cur)=>`<div class="pc-table-row${cur?" cur":""}"><b>${label}</b><span>${pos?pos+"°":"—"}</span><span>${w||l?`${w}-${l}`:"—"}</span><span>${tit}</span></div>`;
  const pcTable = `<div class="pc-table">
      <div class="pc-table-row pc-table-h"><span></span><span>Posición</span><span>Partidos</span><span>Títulos</span></div>
      ${tRow("Temporada",p.pos,wS,ms.length-wS,titlesIn(catTorneos.filter(x=>inYear(x.t))),true)}
      ${tRow("Carrera",careerRow&&careerRow.pos,wC,msCareer.length-wC,titlesIn(catTorneos))}
    </div>`;
  const mediaStyle = foto ? ` style="background-image:url('${esc(foto)}')"` : "";
  const fotoAdmin = state.admin ? `<div class="pc-media-edit">
      <label class="btn ghost sm filebtn">${foto?"Cambiar foto":"Subir foto"}<input type="file" accept="image/*" id="upJugadorFoto"></label>
      ${foto?`<button class="btn ghost sm" data-act="rm-foto-jugador">Quitar</button>`:""}
    </div>` : "";
  return `<section class="wrap page"><div class="page-tools">${yearSel()}</div>
    <div class="pcard"><div class="pc-main">
        <h1 class="display">${esc(s.ap)}</h1><span class="sub">${esc(s.nom)}${s.nom?", ":""}Categoría ${esc(catName(p.cat))}${modNote()}${isProfile?' <span class="me-tag">Tu perfil</span>':""}</span>
      <div class="pc-actions">${isProfile?`<button class="btn ghost sm" data-act="unprofile">Dejar de usar como mi perfil</button>`
        :`<button class="btn sm" data-act="profile">Guardar como mi perfil</button>`}<button class="btn ghost sm" data-act="pick">Elegir ${otroJugador()}</button></div>
      ${pcTable}</div>

}

function adminOrder(m,c){ // orden de la lista del panel: el desempate del año elegido, si existe

  const pos=n=>{ const k=ord.indexOf(n); return k<0?1e6:k; };
  return idx.sort((a,b)=>pos(rows[a][0])-pos(rows[b][0])||a-b);
}

/* --- draft helpers --- */
function setPath(obj,path,val){ const k=path.split("."); let o=obj; for(let i=0;i<k.length-1;i++){ o=o[k[i]]; if(o==null) return; } o[k[k.length-1]]=val; }
function syncDraft(){
  if(!state.draft) return;
  document.querySelectorAll("[data-bind]").forEach(el=>{
    let v=el.value; if(el.dataset.type==="pts") v = v===""?null:Number(v);
    setPath(state.draft,el.dataset.bind,v);
  });
  const groups={};
  document.querySelectorAll("[data-tcats]").forEach(cb=>{ const i=cb.dataset.tcats; if(!groups[i]) groups[i]=[]; if(cb.checked) groups[i].push(cb.value); });
  Object.keys(groups).forEach(i=>{ const t=DM().torneos[+i]; if(t) t.cats=groups[i]; });
}
/* El escudo va dentro del documento del club en Firestore (limite 1 MB por documento): se achica a 256 px. */
function downscaleEscudo(file,max=256){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      if(!img.width||!img.height){ res(fr.result); return; } // p.ej. SVG sin medidas
      const k=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(img.width*k)); cv.height=Math.max(1,Math.round(img.height*k));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      let out=cv.toDataURL("image/png"); if(out.length>300000) out=cv.toDataURL("image/jpeg",.85);
      res(out); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file); });
}
function downscale(file,max=1400){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.82)); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file); });
}
const swap=(arr,i,j)=>{ if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; };

function adminAction(act,el){
  const d=state.draft, m=DM(), i=el.dataset.i!=null?el.dataset.i:null, n=+i;
  syncDraft();
  switch(act){
    case "add-h": d.info.horarios.push({dia:"Sábado",hora:"",cancha:"Cancha 1",mod:genKey(),cat:(m.categorias[0]||{}).id||"",j1:"",j2:""}); break;
    case "del-h": d.info.horarios.splice(n,1); break;
    case "del-infofoto": d.info.foto=""; break;
    case "add-n": d.novedades.push({titulo:"Nueva tarjeta",texto:"",boton:"",link:"",estilo:"simple"}); break;
    case "del-n": d.novedades.splice(n,1); break;
    case "up-n": swap(d.novedades,n,n-1); break;
    case "down-n": swap(d.novedades,n,n+1); break;
    case "add-c": { const id="k"+Date.now().toString(36); m.categorias.push({id,nombre:"Nueva"}); m.ranking[id]=[];
      m.torneos.forEach(t=>t.finales[id]={champ:"",fin:""}); break; }
    case "del-c": { const c=m.categorias[n];
      if(!confirm(`¿Borrar la Cat. ${c.nombre} de ${modGenLabel().toLowerCase()}? Se borran su ranking, sus finales y sus resultados.`)) return;
      m.categorias.splice(n,1); delete m.ranking[c.id]; m.torneos.forEach(t=>{ delete finOf(t)[c.id]; if(t.cats) t.cats=t.cats.filter(x=>x!==c.id); });
      Object.values(m.resultados).forEach(r=>delete r[c.id]);
      d.info.horarios.forEach(h=>{ if((h.mod||"singles-hombres")===genKey()&&h.cat===c.id) h.cat=""; }); break; }
    case "up-c": swap(m.categorias,n,n-1); break;
    case "down-c": swap(m.categorias,n,n+1); break;
    case "add-t": { const f={}; m.categorias.forEach(c=>f[c.id]={champ:"",fin:""});
      const nid="t"+Date.now().toString(36), ny=curYear()!=="todos"?curYear():String(new Date().getFullYear());
      (state.aOpenTours||(state.aOpenTours=new Set())).add(nid); (state.aOpenYears||(state.aOpenYears=new Set())).add(ny);
      m.torneos.push({anio:ny,cats:m.categorias.map(c=>c.id),id:nid,etiqueta:`${m.torneos.length+1}.º torneo`,nombre:"Torneo nuevo",fechas:"",estado:"Próximo",finales:f});
      Object.values(m.ranking).forEach(rows=>rows.forEach(r=>r.push(null))); break; }
    case "del-t": if(!confirm(`¿Borrar ${m.torneos[n].nombre}? También se borran sus puntos del ranking y sus resultados.`)) return;
      delete m.resultados[m.torneos[n].id]; m.torneos.splice(n,1); Object.values(m.ranking).forEach(rows=>rows.forEach(r=>r.splice(n+1,1))); break;
    case "add-r": m.ranking[state.adminCat].push(["Apellido, Nombre",...m.torneos.map(()=>null)]); break;
    case "del-r": m.ranking[state.adminCat].splice(n,1); break;
    case "up-r": case "down-r": { const c=state.adminCat, rows=m.ranking[c], y=curYear(), to=act==="up-r"?n-1:n+1;
      if(y==="todos"){ const v=adminOrder(m,c); swap(rows,v[n],v[to]); }
      else { const names=adminOrder(m,c).map(g=>rows[g][0]); swap(names,n,to); m.desempate=m.desempate||{}; m.desempate[y]=m.desempate[y]||{}; m.desempate[y][c]=names; }
      break; }
    case "add-m": m.resultados[state.adminRes.t][state.adminRes.c][n].m.push(["","",""]); break;
    case "add-m2": { const arr=m.resultados[state.adminRes.t][state.adminRes.c][n].m; arr.push(["","",""]); state.resRound=n; state.resIdx=arr.length-1; break; }
    case "swap-m": { const [ri,mi]=i.split(".").map(Number), mm=m.resultados[state.adminRes.t][state.adminRes.c][ri].m[mi];
      [mm[0],mm[1]]=[mm[1],mm[0]]; const sc=parseScore(mm[2]);
      if(Array.isArray(sc)){ const f=flip(sc); mm[2]=f.map(x=>x.join("-")).join(" ")+(f.ret?(f.length?" ret":"ret"):""); } break; }
    case "save-next": adminAction("save",el); state.resIdx=(state.resIdx==null?0:state.resIdx)+1; break;
    case "del-m": { const [ri,mi]=i.split(".").map(Number); m.resultados[state.adminRes.t][state.adminRes.c][ri].m.splice(mi,1); break; }
    case "del-f": d.fotos.splice(n,1); break;
    case "del-placeholders": d.fotos=d.fotos.filter(f=>f.src); break;
    case "discard": state.draft=clone(data); toast("Cambios descartados"); break;
    case "save": {
      Object.values(d.modalidades).forEach(mm=>Object.values(mm.resultados).forEach(tc=>Object.keys(tc).forEach(c=>{
        tc[c]=tc[c].map(r=>({name:r.name,m:r.m.filter(x=>x[0]||x[1])})); })));
      const prev=data; data=normalize(clone(d));
      if(saveData()) toast("Cambios guardados"); else data=prev;
      break; }
    case "export": { const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="datos-"+clubName().replace(/[^a-z0-9]+/gi,"-").toLowerCase()+".json"; document.body.appendChild(a); a.click(); a.remove(); return; }
    case "reset": if(!confirm(`¿Eliminar TODA la información de ${clubName()}? Se borran torneos, rankings, resultados, horarios, novedades y fotos de todas las modalidades. Los demás clubes no se tocan.`)) return;
      if(!confirm(`Escribí bien: esto borra SOLO ${clubName()}. ¿Seguir?`)) return;
      bkSave("Antes de eliminar todo");
      { const keepClub=clone(data.club||DEFAULT_DATA.club); data=clone(DEFAULT_DATA); data.club=keepClub; } // la ubicación y las redes no son datos de torneos: se conservan
      saveData(); state.draft=clone(data); state.closedTours=null; toast(`Se eliminó la información de ${clubName()}`); break;
    case "wipe-mod": if(!confirm(`¿Eliminar todo lo de ${modGenLabel().toLowerCase()} en ${clubName()}? Se borran sus categorías, torneos, ranking y resultados.`)) return;
      bkSave("Antes de eliminar "+modGenLabel());
      data.modalidades[genKey()]=emptyModalidad(); data.info.horarios=(data.info.horarios||[]).filter(h=>(h.mod||"singles-hombres")!==genKey());
      saveData(); state.draft=clone(data); state.closedTours=null; toast(`Se eliminó ${modGenLabel().toLowerCase()}`); break;
    case "restore": { const arr=bkList(), b=arr[n];
      if(!b){ toast("No hay copia"); return; }
      if(!confirm(`¿Restaurar la copia del ${bkFecha(b.ts)} en ${clubName()}? Lo que hay ahora se reemplaza (se guarda una copia antes).`)) return;
      bkSave("Antes de restaurar");
      try{ data=normalize(migrate(JSON.parse(b.json))); }catch(e){ toast("La copia está dañada"); return; }
      saveData(); state.draft=clone(data); state.closedTours=null; toast("Copia restaurada"); break; }
    case "bk-now": bkSave("Copia manual"); toast("Copia guardada"); break;
    case "cloud-pull": if(!confirm("Se bajan los datos de la nube y se pierden los cambios sin guardar de este dispositivo. ¿Seguir?")) return;
      bkSave("Antes de bajar de la nube"); state.draft=clone(data); cloudAcceptPending(); return;
    case "cloud-push": { const dd=state.draft; if(dd){ const prev=data; data=normalize(clone(dd)); if(!saveData()) data=prev; }
      pendingCloudRev=null; toast("Subido a la nube"); break; }
    case "cloud-up": if(!cloudOn()){ toast("No hay sincronizacion configurada"); return; }
      cloudPushData(CLUB_ID); toast("Subiendo a la nube..."); return;
    case "cloud-down": if(!cloudOn()){ toast("No hay sincronizacion configurada"); return; }
      if(!confirm(`Se reemplaza lo que hay en este dispositivo por lo que esta en la nube para ${clubName()}. ¿Seguir?`)) return;
      bkSave("Antes de bajar de la nube"); cloudAcceptPending(); return;
    case "logout": logout(); return;
  }
  render();
}

/* ================= Ranking como imagen ================= */
/*RANKIMG-START*/
function rrectPath(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fitText(g,t,max){ t=String(t); if(g.measureText(t).width<=max) return t; while(t.length>1&&g.measureText(t+"…").width>max) t=t.slice(0,-1); return t.trimEnd()+"…"; }
/* Dibuja el ranking en un canvas de 1080 px de ancho (el alto se ajusta a la cantidad de filas, máx. ~1350 = vertical de Instagram). */
function drawRankImage(canvas,o){
  const W=1080, PAD=48, L=64, ROW=76, c=o.c, F=(w,px)=>`${w} ${px}px ${o.font}`;
  const n=o.rows.length, cardTop=380, cardH=n*ROW+40+(o.extra?56:0), cardBottom=cardTop+cardH, H=Math.max(720,cardBottom+100);
  canvas.width=W; canvas.height=H;
  const g=canvas.getContext("2d");
  g.fillStyle=c.bg; g.fillRect(0,0,W,H);
  // escudo (o iniciales) + club
  const S=104, sy=64;
  g.save(); g.beginPath(); g.arc(L+S/2,sy+S/2,S/2,0,Math.PI*2); g.clip();
  g.fillStyle=c.surface; g.fillRect(L,sy,S,S);
  if(o.escudoImg){ const k=Math.max(S/o.escudoImg.width,S/o.escudoImg.height); g.drawImage(o.escudoImg,L+(S-o.escudoImg.width*k)/2,sy+(S-o.escudoImg.height*k)/2,o.escudoImg.width*k,o.escudoImg.height*k); }
  else { g.fillStyle=o.club.color||c.accent; g.fillRect(L,sy,S,S); g.fillStyle="#fff"; g.font=F(800,42); g.textAlign="center"; g.textBaseline="middle"; g.fillText(o.club.ini,L+S/2,sy+S/2+2); }
  g.restore();
  g.textAlign="left"; g.textBaseline="alphabetic";
  const tx=L+S+28, tw=W-L-tx;
  g.fillStyle=c.text; g.font=F(800,44); g.fillText(fitText(g,o.club.nombre,tw),tx,sy+48);
  g.fillStyle=c.muted; g.font=F(500,30); g.fillText(fitText(g,o.sub,tw),tx,sy+92);
  // título
  g.fillStyle=c.accent; g.font=F(800,26); if("letterSpacing" in g) g.letterSpacing="4px";
  g.fillText(o.kicker,L,254); if("letterSpacing" in g) g.letterSpacing="0px";
  g.fillStyle=c.text; g.font=F(900,96); g.fillText(fitText(g,o.title,W-2*L),L,342);
  // tarjeta con las filas
  rrectPath(g,PAD,cardTop,W-2*PAD,cardH,28); g.fillStyle=c.surface; g.fill();
  g.globalAlpha=.13; g.lineWidth=2; g.strokeStyle=c.text; g.stroke(); g.globalAlpha=1;
  const R=W-PAD-32, bx=PAD+28+26, nx=bx+26+22, maxN=R-150-nx;
  o.rows.forEach((r,i)=>{
    const y=cardTop+20+i*ROW, cy=y+ROW/2;
    if(i>0){ g.globalAlpha=.10; g.fillStyle=c.text; g.fillRect(PAD+28,y,W-2*PAD-56,2); g.globalAlpha=1; }
    g.beginPath(); g.arc(bx,cy,26,0,Math.PI*2);
    if(r.pos<=3){ g.fillStyle=[c.gold,c.silver,c.bronze][r.pos-1]; g.fill(); g.fillStyle="#1B130F"; }
    else { g.globalAlpha=.3; g.lineWidth=2; g.strokeStyle=c.text; g.stroke(); g.globalAlpha=1; g.fillStyle=c.text; }
    g.font=F(800,26); g.textAlign="center"; g.textBaseline="middle"; g.fillText(String(r.pos),bx,cy+2);
    g.textAlign="left"; g.font=F(800,32); g.fillStyle=c.text;
    const ap=fitText(g,r.ap,maxN); g.fillText(ap,nx,cy+2);
    if(r.nom){ const w=g.measureText(ap).width+10, left=maxN-w; if(left>50){ g.font=F(500,32); g.fillStyle=c.muted; g.fillText(fitText(g,r.nom,left),nx+w,cy+2); } }
    g.textAlign="right"; g.font=F(500,22); g.fillStyle=c.muted; g.fillText("pts",R,cy+4);
    const pw=g.measureText("pts").width; g.font=F(900,38); g.fillStyle=c.text; g.fillText(String(r.total),R-pw-10,cy+2);
  });
  if(o.extra){ g.textAlign="center"; g.font=F(600,26); g.fillStyle=c.muted; g.fillText(`+ ${o.extra} más en el ranking completo`,W/2,cardTop+20+n*ROW+36); }
  // pie
  const fy=cardBottom+58; g.textBaseline="alphabetic";
  g.fillStyle=c.ball; g.beginPath(); g.arc(L+12,fy-9,12,0,Math.PI*2); g.fill();
  g.textAlign="left"; g.font=F(700,26); g.fillStyle=c.muted; g.fillText(o.footL,L+34,fy);
  g.textAlign="right"; g.font=F(500,24); g.fillText(o.footR,W-L,fy);
}

/* ================= Carga rápida de resultados (un partido por pantalla) ================= */
function resDefaultRound(rs){
  let i=rs.findIndex(r=>r.m.some(x=>(x[0]||x[1])&&!String(x[2]||"").trim()));
  if(i<0){ for(let k=rs.length-1;k>=0;k--) if(rs[k].m.length){ i=k; break; } }
  return i<0?0:i;
}
function resTable(rs,base){
  return rs.map((r,ri)=>`<div class="block"><div class="block-head"><strong>${r.name}</strong></div>
      ${r.m.length?`<div class="scroll-x"><table class="etable"><thead><tr><th>Ganador</th><th>Perdedor</th><th>Score</th><th></th></tr></thead><tbody>
      ${r.m.map((m,mi)=>`<tr>${C(`${base}.${ri}.m.${mi}.0`,m[0],'list="dlPlayers"')}${C(`${base}.${ri}.m.${mi}.1`,m[1],'list="dlPlayers"')}
        ${C(`${base}.${ri}.m.${mi}.2`,m[2],'style="width:150px" placeholder="6-4 6-2"')}<td>${IB("del-m",`${ri}.${mi}`,"trash","Borrar partido")}</td></tr>`).join("")}
      </tbody></table></div>`:`<p class="muted" style="margin:0">Sin partidos en esta ronda.</p>`}
      <div><button type="button" class="btn ghost sm" data-act="add-m" data-i="${ri}">${icon("plus")}Agregar partido</button></div></div>`).join("");
}
function resCard(rs,base){
  let ri=state.resRound; if(ri==null||ri<0||ri>=rs.length) ri=state.resRound=resDefaultRound(rs);
  const list=rs[ri].m;
  let mi=state.resIdx; if(mi==null) mi=Math.max(0,list.findIndex(x=>(x[0]||x[1])&&!String(x[2]||"").trim()));
  mi=Math.min(Math.max(mi,0),Math.max(list.length-1,0)); state.resIdx=mi;
  const chips=`<div class="scroll-x"><div class="seg" role="group" aria-label="Ronda">${rs.map((r,k)=>
    `<button type="button" data-resround="${k}" aria-pressed="${k===ri}">${esc(r.name)}${r.m.length?`<span class="cnt">${r.m.length}</span>`:""}</button>`).join("")}</div></div>`;

function scoreFromGrid(card){

/* ================= Modo pantalla del club ================= */
const SCR = {i:0,t:0,secs:15,paused:false,timer:null,wake:null};
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const DIAS_ES = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
const chunk = (a,n) => { const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
function schedTag(h){
  const key=h.mod||"singles-hombres", m=data.modalidades[key], c=m&&m.categorias.find(x=>x.id===h.cat);
  return (c?"Cat. "+c.nombre:"")+(key!=="singles-hombres"?(c?" · ":"")+(MODCOMBO_LABEL()[key]||key):"");
}
function schedHTML(items){
  const days=[]; items.forEach(h=>{ const k=h.dia||""; let d=days.find(x=>x.k===k); if(!d) days.push(d={k,l:[]}); d.l.push(h); });
  const row=h=>`<div class="sch-row"><span class="sch-h">${esc(h.hora||"—")}</span><span class="sch-c">${esc(h.cancha||"")}</span>
    <span class="sch-m">${esc(plainName(h.j1||"A definir"))}<em>vs</em>${esc(plainName(h.j2||"A definir"))}</span><span class="sch-t">${esc(schedTag(h))}</span></div>`;
  return `<div class="sch">${days.map(d=>(days.length>1?`<h2 class="sch-day">${esc(d.k)}</h2>`:"")+d.l.map(row).join("")).join("")}</div>`;
}
function screenSlides(){
  const out=[], inf=data.info||{};
  if(inf.modo==="canchas" && (inf.horarios||[]).length){
    const all=inf.horarios.filter(h=>h.j1||h.j2||h.hora), hoy=DIAS_ES[new Date().getDay()];
    const de=all.filter(h=>norm(h.dia).includes(hoy)), items=(de.length?de:all).slice();
    const order=[...new Set(items.map(h=>h.dia||""))];
    items.sort((a,b)=>order.indexOf(a.dia||"")-order.indexOf(b.dia||"")||String(a.hora||"").localeCompare(String(b.hora||""),"es",{numeric:true}));
    const pages=chunk(items,12), fecha=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
    pages.forEach((p,k)=>out.push({kind:"sched",secs:15,title:de.length?"Horarios de hoy":(inf.titulo||"Horarios"),
      sub:(de.length?fecha:"")+(pages.length>1?(de.length?" · ":"")+`${k+1}/${pages.length}`:""),html:schedHTML(p)}));
  } else if(inf.modo==="foto" && inf.foto){
    out.push({kind:"photo",secs:15,title:inf.titulo||"Horarios",sub:"",html:`<img class="scr-img" src="${esc(inf.foto)}" alt="${esc(inf.titulo||"Horarios")}">`});
  }
  const picks=[];
  MODCOMBOS().forEach(([key,label])=>{
    const m=data.modalidades[key]; if(!m||!(m.torneos||[]).length) return;
    const live=m.torneos.filter(t=>t.estado==="En juego");
    const fin=m.torneos.filter(t=>t.estado==="Finalizado").sort((a,b)=>String(a.anio||"").localeCompare(String(b.anio||"")));
    const t=live.length?live[live.length-1]:fin[fin.length-1]; // sin nada en juego, el último torneo terminado
    if(t) picks.push({key,label,m,t,live:!!live.length});
  });
  const anyLive=picks.some(p=>p.live); // con un torneo en juego, la tele muestra solo lo que se está jugando
  picks.filter(p=>!anyLive||p.live).forEach(({key,label,m,t})=>{
    tourCats(t,m).forEach(c=>{
      const b=bracketHTML(m,t,c.id), tag=`Cat. ${c.nombre}${key!=="singles-hombres"?" · "+label:""}`;
      if(b){ out.push({kind:"draw",secs:20,title:t.nombre,sub:`Cuadro · ${tag}`,html:b}); return; }
      const rs=roundsOfM(m,t.id,c.id).filter(r=>r.m.length); if(!rs.length) return;
      const r=rs[rs.length-1], pages=chunk(r.m,8);
      pages.forEach((p,k)=>out.push({kind:"res",secs:15,title:t.nombre,sub:`${r.name} · ${tag}${pages.length>1?` · ${k+1}/${pages.length}`:""}`,
        html:`<div class="matches">${p.map(x=>matchSB(x)).join("")}</div>`}));
    });
  });
  return out;
}
function vPantalla(){
  const slides=screenSlides(), n=slides.length;
  const club=clubStore.get().find(c=>c.id===CLUB_ID);
  const clock=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  const idx=n?((SCR.i%n)+n)%n:0; SCR.i=idx; const s=slides[idx]; if(s) SCR.secs=s.secs;
  const head=(title,sub)=>`<div class="scr-head">${club?`<span ${shieldAttrs(club)}>${shieldHTML(club)}</span>`:""}
    <div><h1>${esc(title)}</h1>${sub?`<p class="sub">${esc(sub)}</p>`:""}</div><span class="scr-clock" id="scrClock">${clock}</span></div>`;
  const foot=`<div class="scr-foot"><div class="scr-dots">${slides.map((_,k)=>`<i${k===idx?' class="on"':""}></i>`).join("")}</div>
    <div class="scr-ctl" role="group" aria-label="Controles de la pantalla"><button type="button" data-scr="prev">‹</button>
    <button type="button" data-scr="pause">${SCR.paused?"Seguir":"Pausa"}</button><button type="button" data-scr="next">›</button>
    <button type="button" data-scr="full">Pantalla completa</button><button type="button" data-scr="link">Copiar link para la tele</button><button type="button" data-scr="exit">Salir</button></div></div>`;
  if(!s) return `<section class="scr">${head(club?club.nombre:"Torneos","")}<div class="scr-body"><div class="empty"><strong>Todavía no hay nada para mostrar</strong>Cargá horarios o resultados desde el panel y van a aparecer acá solos.</div></div>${foot}</section>`;
  return `<section class="scr">${head(s.title,s.sub)}<div class="scr-body">${s.html}</div>${foot}</section>`;
}
function screenTick(){
  if(location.hash.replace(/^#/,"").split("/")[0]!=="pantalla"){ screenStop(); return; }
  const el=document.getElementById("scrClock"); if(el) el.textContent=new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
  if(SCR.paused) return;
  if(++SCR.t>=SCR.secs){ SCR.i++; SCR.t=0; render(); }
}
function screenStart(){
  if(!SCR.timer) SCR.timer=setInterval(screenTick,1000);
  if(!SCR.wake && navigator.wakeLock && !document.hidden){ // que la tele no se apague sola
    navigator.wakeLock.request("screen").then(l=>{ SCR.wake=l; l.addEventListener("release",()=>{ SCR.wake=null; }); }).catch(()=>{}); }
}
function screenStop(){
  if(SCR.timer){ clearInterval(SCR.timer); SCR.timer=null; }
  if(SCR.wake){ try{ SCR.wake.release(); }catch(e){} SCR.wake=null; }
}
function screenAction(a){
  if(a==="prev"){ SCR.i--; SCR.t=0; render(); }
  else if(a==="next"){ SCR.i++; SCR.t=0; render(); }
  else if(a==="pause"){ SCR.paused=!SCR.paused; render(); }
  else if(a==="full"){ if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>toast("Este navegador no permite pantalla completa")); }
  else if(a==="link"){ const url=baseUrl()+"?c="+encodeURIComponent(CLUB_ID)+"#pantalla";
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast("Link copiado. Abrilo en el navegador de la tele.")).catch(()=>prompt("Copiá este link:",url));
    else prompt("Copiá este link:",url); }
  else if(a==="exit"){ if(document.fullscreenElement) document.exitFullscreen(); location.hash=""; }
}
document.addEventListener("keydown",e=>{
  if(location.hash.replace(/^#/,"").split("/")[0]!=="pantalla") return;
  if(e.target.closest&&e.target.closest("input,textarea,select")) return;
  if(e.key==="ArrowRight") screenAction("next"); else if(e.key==="ArrowLeft") screenAction("prev");
  else if(e.key===" "){ e.preventDefault(); screenAction("pause"); }
});
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && SCR.timer && !SCR.wake) screenStart(); });

        const obj=migrate(raw); if(!obj.modalidades) throw 0;
        if(!confirm(`Este archivo es una copia completa y reemplaza toda la información de ${clubName()}. ¿Seguir?`)) { el.value=""; return; }
        if(!obj.club) obj.club=clone(data.club||DEFAULT_DATA.club); // copias viejas no traen ubicación ni redes: se conservan las actuales
        data=Object.assign(clone(DEFAULT_DATA),obj);
      }
      normalize(data); saveData(); state.draft=clone(data); state.closedTours=null; state.anio=""; toast("Datos importados"); }
    catch(err){ toast("Ese archivo no es una copia válida"); }
    render(); }
});
window.addEventListener("hashchange",()=>{ state.round=0; if(!location.hash.startsWith("#partidos")) state.picking=false; render(); });

/* Lightbox fotos */
const lb=document.getElementById("lb");
function openPhoto(i){
  const list=state.photoList&&state.photoList.length?state.photoList:data.fotos.map((_,k)=>k);
  const n=list.length; if(!n) return; state.photo=(i+n)%n; const f=data.fotos[list[state.photo]];
  document.getElementById("lbFig").innerHTML=f.src?`<img src="${esc(f.src)}" alt="${esc(f.texto||"Foto "+(state.photo+1))}">`:`<span>Foto ${state.photo+1}</span>`;
  document.getElementById("lbCount").textContent=`${state.photo+1} de ${n}${f.texto?`, ${f.texto}`:""}`;
  if(!lb.open) lb.showModal();
}
document.getElementById("lbPrev").onclick=()=>openPhoto(state.photo-1);
document.getElementById("lbNext").onclick=()=>openPhoto(state.photo+1);
document.getElementById("lbClose").onclick=()=>lb.close();
lb.addEventListener("click",e=>{ if(e.target===lb) lb.close(); });
lb.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") openPhoto(state.photo-1); if(e.key==="ArrowRight") openPhoto(state.photo+1); });
/* Visor de horarios */
const sv=document.getElementById("sv"), svBox=document.getElementById("svBox");
function openSched(){ const im=document.getElementById("svImg"); im.src=data.info.foto; im.alt=data.info.titulo;
  document.getElementById("svCap").textContent=data.info.titulo; svBox.classList.remove("zoom"); sv.showModal(); }
const toggleZoom=()=>svBox.classList.toggle("zoom");
document.getElementById("svImg").onclick=toggleZoom;
document.getElementById("svZoom").onclick=toggleZoom;
document.getElementById("svClose").onclick=()=>sv.close();
sv.addEventListener("click",e=>{ if(e.target===sv) sv.close(); });

/* Tema claro/oscuro */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyMode(){ const t=store.get("theme",null); document.documentElement.dataset.mode=(t?t==="dark":mq.matches)?"dark":"light"; }
mq.addEventListener&&mq.addEventListener("change",applyMode);
function toggleTheme(){ const next=document.documentElement.dataset.mode==="dark"?"light":"dark"; store.set("theme",next); applyMode(); }
document.getElementById("themeBtn").onclick=toggleTheme;
document.getElementById("gateThemeBtn").onclick=toggleTheme;

/* Color de la barra del celular = fondo del tema que esté usando la persona */
(function(){
  const m=document.querySelector('meta[name="theme-color"]'); if(!m) return;
  const sync=()=>{ const c=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); if(c) m.setAttribute("content",c); };
  new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["data-mode","data-surface"]});
  sync();
})();

/* Modo sin conexión: sw.js guarda la app para abrirla sin internet. Solo funciona con la app publicada online (https), no como archivo local. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

applyMode();
render();

/* Si esta pestaña ya tenía una sesión abierta (club o jugador), entra directo sin pedir la clave de nuevo.
   Va al final porque necesita que state y data ya estén cargados. */
cloudInit();

function autoEnterSession(){
  try{
    const sid = sessionStorage.getItem("liga_sesion")||"", i = sid.indexOf(":");
    const rol = i<0?"":sid.slice(0,i), id = i<0?"":sid.slice(i+1);
    if((rol==="admin"||rol==="jugador") && clubStore.get().some(c=>c.id===id)) enterClub(id, rol);
  }catch(e){}
}
(function autoEnter(){
  if(LINK){
    if(tryDeepLink()) return;
    /* celular nuevo: la lista de clubes llega de la nube en unos segundos; si no aparece, se sigue normal */
    setTimeout(()=>{ if(!linkPending) return; linkPending=false; renderGate(); toast("No encontramos el club de ese link"); autoEnterSession(); },9000);
    return;
  }
  autoEnterSession();
})();
</script>
