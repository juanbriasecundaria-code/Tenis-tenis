  // puntos válidos: de 16avos (10) a campeón (100); en torneos de 2025 o antes también la ronda previa (5).
  // Cualquier otro valor cuenta como "no jugó".
  const OK=[10,20,40,60,80,100];
  Object.values(d.modalidades||{}).forEach(m=>Object.values(m.ranking||{}).forEach(rows=>rows.forEach(r=>{
    for(let k=1;k<r.length;k++){ const v=r[k], t=(m.torneos||[])[k-1];
      if(v!=null&&v!==""&&!OK.includes(+v)&&!(+v===5&&t&&allows5(t))) r[k]=null; }
  })));

  Object.values(d.modalidades||{}).forEach(m=>{
    if(!m.inscritos||typeof m.inscritos!=="object") m.inscritos={};
    if(!m.sorteos||typeof m.sorteos!=="object") m.sorteos={};
    Object.values(m.inscritos).forEach(o=>Object.keys(o||{}).forEach(c=>{ o[c]=(Array.isArray(o[c])?o[c]:[]).map(x=>String(x==null?"":x).trim()).filter(Boolean); }));

  });

}

  const canon=p=>{ if(roster.includes(p)) return p; const c=roster.filter(n=>split(n).ap===p); return c.length===1?c[0]:p; };
  const mio=t=>t===name||inTeam(t,name), rivals=new Map();
  orderedTours().forEach(t=>tourCats(t).forEach(c=>roundsOf(t.id,c.id).forEach(r=>r.m.forEach(m=>{
    if(!m[0]||!m[1]) return;
    const a=mio(m[0]), b=mio(m[1]); if(a===b) return;
    const sc=parseScore(m[2]), won=a, mine=won?m[0]:m[1], opp=won?m[1]:m[0];
    const partner=isTeam(mine)?teamParts(mine).filter(p=>p!==name&&p!==split(name).ap).map(p=>split(p).ap).join(" / "):"";
    const it={torneo:t.nombre,anio:t.anio,round:r.name,mine,opp,partner,won,sets:sc==="WO"?"WO":sc?(won?sc:flip(sc)):null};
    (isTeam(opp)?teamParts(opp):[opp]).forEach(p=>{
      const k=canon(p); if(k===name) return;
      if(!rivals.has(k)) rivals.set(k,{name:k,w:0,l:0,ms:[]});
      const e=rivals.get(k); won?e.w++:e.l++; e.ms.push(it);
    });
  }))));
  return [...rivals.values()].map(e=>({...e,known:roster.includes(e.name)})).sort((x,y)=>(y.w+y.l)-(x.w+x.l)||y.w-x.w||x.name.localeCompare(y.name));

  for(let i=ts.length-1;i>=0;i--){ const t=ts[i]; if(t.estado==="Finalizado"&&tourCats(t).some(c=>finOf(t)[c.id]&&finOf(t)[c.id].champ)) return t; }
  return null;
}

function scoreboard(a,b,sets,aWon,compact=false,short=false){
  const nm = n => { if(!short) return esc(shortName(n));
    const s=dispSplit(n); return esc(s.nom ? `${s.ap} ${s.nom.trim()[0].toUpperCase()}.` : s.ap); };
  const min = compact?0:3; // en Resultados fijamos 3 columnas para que todas las líneas alineen
  let n=1,rowA="",rowB="";
  if(sets==="WO"){
    rowA = aWon?'<span class="g wo">W.O.</span>':'<span class="g"></span>';
    rowB = aWon?'<span class="g"></span>':'<span class="g wo">W.O.</span>';
  } else if(!sets){
    rowA = rowB = '<span class="g" title="Score sin cargar">–</span>';
  } else {
    n=sets.length;
    sets.forEach(([x,y])=>{ const st=Math.max(x,y)>=10?" st":"", t=st?' title="Super tie-break"':"";
      rowA+=`<span class="g${x>y?" won":""}${st}"${t}>${x}</span>`; rowB+=`<span class="g${y>x?" won":""}${st}"${t}>${y}</span>`; });
  }
  if(Array.isArray(sets)&&sets.ret){ // el que se retiró es el perdedor
    rowA+=aWon?'<span class="g"></span>':'<span class="g wo" title="Se retiró">ret.</span>';
    rowB+=aWon?'<span class="g wo" title="Se retiró">ret.</span>':'<span class="g"></span>'; n+=1; }
  if(n<min){ const pad='<span class="g pad"></span>'.repeat(min-n); rowA+=pad; rowB+=pad; n=min; }
  return `<div class="sb${compact?" c":""}" style="--n:${n}">
    <div class="sb-row${aWon?" w":""}"><span class="sb-name" title="${esc(a)}">${nm(a)}</span>${rowA}</div>
    <div class="sb-row${aWon?"":" w"}"><span class="sb-name" title="${esc(b)}">${nm(b)}</span>${rowB}</div></div>`;
}
const matchSB = (m,compact) => scoreboard(m[0],m[1],parseScore(m[2]),true,compact);

function schedGroups(list){
  // agrupa por modalidad+género y categoría, respetando el orden de las categorías
  const groups=[];
  MODCOMBOS().forEach(([key])=>{
    const m=data.modalidades[key]; if(!m) return;
    const ids=[...m.categorias.map(c=>c.id),""];
    ids.forEach(id=>{ const items=list.filter(h=>(h.mod||"singles-hombres")===key&&(h.cat||"")===id); if(items.length) groups.push({mod:key,id,
      nombre:id?`Categoría ${(m.categorias.find(c=>c.id===id)||{nombre:id}).nombre}`:"Sin categoría",items}); });
    const known=new Set(ids); const orphan=list.filter(h=>(h.mod||"singles-hombres")===key&&!known.has(h.cat||""));
    if(orphan.length) groups.push({mod:key,id:"?",nombre:"Otras categorías",items:orphan});
  });
  return groups;
}

const REDES=[["instagram","Instagram","instagram","@usuario o link"],["facebook","Facebook","facebook","nombre de la página o link"],
  ["whatsapp","WhatsApp","whatsapp","número con código de área, ej. 5492324123456"],["tiktok","TikTok","tiktok","@usuario o link"],
  ["youtube","YouTube","youtube","@canal o link"],["web","Sitio web","globe","www.miclub.com"]];
function redHref(tipo,val){ // acepta @usuario, dominio o link completo; siempre devuelve https o vacío
  const v=String(val||"").trim(); if(!v) return "";
  if(/^https?:\/\//i.test(v)) return v;
  if(tipo==="whatsapp"){ const n=v.replace(/\D/g,""); return n?"https://wa.me/"+n:""; }
  if(tipo==="web") return "https://"+v.replace(/^\/+/,"");
  if(/^www\./i.test(v)||v.includes("/")) return "https://"+v.replace(/^\/+/,"");
  const u=encodeURIComponent(v.replace(/^@/,""));
  return ({instagram:"https://instagram.com/"+u,facebook:"https://facebook.com/"+u,tiktok:"https://tiktok.com/@"+u,youtube:"https://youtube.com/@"+u})[tipo]||"";
}

/* Devuelve el cuadro dibujado, o "" si todavía faltan cruces. Recibe la modalidad para poder usarse también desde el modo pantalla. */
function bracketHTML(m,t,cid){
  const sd=drawOf(m,t.id,cid); if(sd) return drawBracketHTML(m,t,cid,sd); // hay sorteo: el cuadro sale de ahí y se completa con los resultados
  const all=roundsOfM(m,t.id,cid), names=["Octavos","Cuartos","Semifinal","Final"], need=[8,4,2,1];
  const rounds=names.map(n=>all.find(r=>r.name===n));
  if(!rounds.every((r,i)=>r&&r.m.length===need[i])) return "";
  const winners=[];
  const cols=rounds.map((rd,ri)=>{
    const boxes=rd.m.map((mm,mi)=>{
      let top=mm[0],bot=mm[1];
      if(ri>0){ const a=winners[ri-1][mi*2], b=winners[ri-1][mi*2+1]; if([a,b].includes(mm[0])&&[a,b].includes(mm[1])){top=a;bot=b;} }
      (winners[ri]||(winners[ri]=[]))[mi]=mm[0];
      const sc=parseScore(mm[2]), topWon=top===mm[0];
      return scoreboard(top,bot,Array.isArray(sc)&&!topWon?flip(sc):sc,topWon,true,true);
    });
    let slots=""; if(boxes.length===1) slots=`<div class="single">${boxes[0]}</div>`;
    else for(let i=0;i<boxes.length;i+=2) slots+=`<div class="pair">${boxes[i]}${boxes[i+1]}</div>`;
    return `<div class="bcol"><h3>${rd.name}</h3><div class="slots">${slots}</div></div>`;
  }).join("");
  const ch=dispSplit(rounds[3].m[0][0]);
  return `<div class="bracket-box scroll-x"><div class="bracket">${cols}
      <div class="bcol"><h3>Campeón</h3><div class="slots"><div class="single"><div class="champ-card">${icon("trophy")}
        <small>${esc(t.nombre)}, Cat. ${esc(catName(cid,m))}</small><strong>${esc(ch.ap)}</strong><small>${esc(ch.nom)}</small></div></div></div></div></div></div>`;
}

/* Rival "de turno" de un jugador según el cuadro: busca, ronda por ronda, el primer partido sin definir donde aparece.
   Si ya perdió, es campeón, o no está en el cuadro, no encuentra nada (null) y el horario cae al modo manual. */
function autoRival(m,tid,cid,player){
  if(!player) return null;
  const sd=drawOf(m,tid,cid); if(!sd) return null;
  const dr=drawRounds(m,tid,cid,sd), key=sideKey(player);
  for(const rd of dr.rounds){
    for(const mt of rd.matches){
      if(mt.win!=null) continue; // ese cruce ya se jugó; si ganó, sigue en la próxima ronda
      const ka=mt.a?sideKey(mt.a):"", kb=mt.b?sideKey(mt.b):"";
      if(ka===key) return {other:mt.b||"",round:rd.name};
      if(kb===key) return {other:mt.a||"",round:rd.name};
    }
  }
  return null;
}
/* Lado de un partido del horario: si hay inscriptos cargados para ese torneo+categoría, se elige de una lista (ya como "X vs Y");

function hSide(i,side,val,participants,backLabel){
  const bind=`info.horarios.${i}.${side}`, key=`${i}-${side}`;
  const forced = val && participants.length && !participants.includes(val);
  const free = !participants.length || forced || (state.hFree&&state.hFree.has(key));
  if(free) return `<div style="display:flex;align-items:center;gap:6px;flex:1 1 220px"><span class="cell" style="flex:1 1 auto">${IN(bind,val,'list="dlPlayers" placeholder="A definir" autocomplete="off" data-rerender')}</span>
    ${participants.length?`<button type="button" class="btn ghost sm" data-act="hfree-off" data-i="${i}" data-side="${side}">${backLabel||"Elegir de la lista"}</button>`:""}</div>`;
  return `<div style="display:flex;align-items:center;gap:6px;flex:1 1 220px"><span class="cell" style="flex:1 1 auto">${SL(bind,val,[["","A definir"],...participants.map(p=>[p,plainName(p)])],'data-rerender')}</span>

function hRowHTML(h,i){
  const key=h.mod||"singles-hombres";
  const m=state.draft.modalidades[key]||state.draft.modalidades["singles-hombres"];
  const abiertos=(m.torneos||[]).filter(t=>t.estado!=="Finalizado").sort((a,b)=>(a.estado==="En juego"?0:1)-(b.estado==="En juego"?0:1));
  const multi=abiertos.length>1;
  const tor=multi?(abiertos.find(t=>t.id===h.tor)?h.tor:abiertos[0].id):(abiertos[0]?abiertos[0].id:"");
  const torneoObj=abiertos.find(t=>t.id===tor);
  const cats=torneoObj?tourCats(torneoObj,m):m.categorias;
  const catSel=cats.find(c=>c.id===h.cat);
  const participants=(torneoObj&&catSel)?inscList(m,tor,catSel.id):[];
  const sd=catSel?drawOf(m,tor,catSel.id):null;
  const j2Key=`${i}-j2`, j2Manual=state.hFree&&state.hFree.has(j2Key);
  const auto=(sd&&h.j1&&!j2Manual)?autoRival(m,tor,catSel.id,h.j1):null;

    ? `<div style="display:flex;align-items:center;gap:6px;flex:1 1 220px"><span class="cell" style="flex:1 1 auto;opacity:.85" title="${esc(auto.round)}">${IN(`info.horarios.${i}.j2`,auto.other,'readonly tabindex="-1" placeholder="A definir (según el cuadro)"')}</span>

      ${multi?`<label class="f" style="flex:1 1 150px">Torneo${SL(`info.horarios.${i}.tor`,tor,abiertos.map(t=>[t.id,t.nombre||"Torneo"]),'data-rerender')}</label>`:""}

function adminOrder(m,c){ // orden de la lista del panel: el desempate del año elegido, si existe
  const rows=m.ranking[c]||[], y=curYear(), ord=(y!=="todos"&&m.desempate&&m.desempate[y]&&m.desempate[y][c])||null;
  const idx=rows.map((_,g)=>g); if(!ord) return idx;
  const pos=n=>{ const k=ord.indexOf(n); return k<0?1e6:k; };
  return idx.sort((a,b)=>pos(rows[a][0])-pos(rows[b][0])||a-b);
}

function syncDraft(){

    let v=el.value; if(el.dataset.type==="pts") v = v===""?null:Number(v);

/* El escudo va dentro del documento del club en Firestore (limite 1 MB por documento): se achica a 256 px. */
function downscaleEscudo(file,max=256){

    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      if(!img.width||!img.height){ res(fr.result); return; } // p.ej. SVG sin medidas
      const k=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(img.width*k)); cv.height=Math.max(1,Math.round(img.height*k));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      let out=cv.toDataURL("image/png"); if(out.length>300000) out=cv.toDataURL("image/jpeg",.85);
      res(out); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file); });
}

/*RANKIMG-START*/
function rrectPath(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fitText(g,t,max){ t=String(t); if(g.measureText(t).width<=max) return t; while(t.length>1&&g.measureText(t+"…").width>max) t=t.slice(0,-1); return t.trimEnd()+"…"; }
/* Dibuja el ranking en un canvas de 1080 px de ancho (el alto se ajusta a la cantidad de filas, máx. ~1350 = vertical de Instagram). */
function drawRankImage(canvas,o){
  const W=1080, PAD=48, L=64, ROW=76, c=o.c, F=(w,px)=>`${w} ${px}px ${o.font}`;
  const n=o.rows.length, cardTop=380, cardH=n*ROW+40+(o.extra?56:0), cardBottom=cardTop+cardH, H=Math.max(720,cardBottom+100);
  canvas.width=W; canvas.height=H;
  const g=canvas.getContext("2d");
  g.fillStyle=c.bg; g.fillRect(0,0,W,H);
  // escudo (o iniciales) + club
  const S=104, sy=64;
  g.save(); g.beginPath(); g.arc(L+S/2,sy+S/2,S/2,0,Math.PI*2); g.clip();
  g.fillStyle=c.surface; g.fillRect(L,sy,S,S);
  if(o.escudoImg){ const k=Math.max(S/o.escudoImg.width,S/o.escudoImg.height); g.drawImage(o.escudoImg,L+(S-o.escudoImg.width*k)/2,sy+(S-o.escudoImg.height*k)/2,o.escudoImg.width*k,o.escudoImg.height*k); }
  else { g.fillStyle=o.club.color||c.accent; g.fillRect(L,sy,S,S); g.fillStyle="#fff"; g.font=F(800,42); g.textAlign="center"; g.textBaseline="middle"; g.fillText(o.club.ini,L+S/2,sy+S/2+2); }
  g.restore();
  g.textAlign="left"; g.textBaseline="alphabetic";
  const tx=L+S+28, tw=W-L-tx;
  g.fillStyle=c.text; g.font=F(800,44); g.fillText(fitText(g,o.club.nombre,tw),tx,sy+48);
  g.fillStyle=c.muted; g.font=F(500,30); g.fillText(fitText(g,o.sub,tw),tx,sy+92);
  // título
  g.fillStyle=c.accent; g.font=F(800,26); if("letterSpacing" in g) g.letterSpacing="4px";
  g.fillText(o.kicker,L,254); if("letterSpacing" in g) g.letterSpacing="0px";
  g.fillStyle=c.text; g.font=F(900,96); g.fillText(fitText(g,o.title,W-2*L),L,342);
  // tarjeta con las filas
  rrectPath(g,PAD,cardTop,W-2*PAD,cardH,28); g.fillStyle=c.surface; g.fill();
  g.globalAlpha=.13; g.lineWidth=2; g.strokeStyle=c.text; g.stroke(); g.globalAlpha=1;
  const R=W-PAD-32, bx=PAD+28+26, nx=bx+26+22, maxN=R-150-nx;
  o.rows.forEach((r,i)=>{
    const y=cardTop+20+i*ROW, cy=y+ROW/2;
    if(i>0){ g.globalAlpha=.10; g.fillStyle=c.text; g.fillRect(PAD+28,y,W-2*PAD-56,2); g.globalAlpha=1; }
    g.beginPath(); g.arc(bx,cy,26,0,Math.PI*2);
    if(r.pos<=3){ g.fillStyle=[c.gold,c.silver,c.bronze][r.pos-1]; g.fill(); g.fillStyle="#1B130F"; }
    else { g.globalAlpha=.3; g.lineWidth=2; g.strokeStyle=c.text; g.stroke(); g.globalAlpha=1; g.fillStyle=c.text; }
    g.font=F(800,26); g.textAlign="center"; g.textBaseline="middle"; g.fillText(String(r.pos),bx,cy+2);
    g.textAlign="left"; g.font=F(800,32); g.fillStyle=c.text;
    const ap=fitText(g,r.ap,maxN); g.fillText(ap,nx,cy+2);
    if(r.nom){ const w=g.measureText(ap).width+10, left=maxN-w; if(left>50){ g.font=F(500,32); g.fillStyle=c.muted; g.fillText(fitText(g,r.nom,left),nx+w,cy+2); } }
    g.textAlign="right"; g.font=F(500,22); g.fillStyle=c.muted; g.fillText("pts",R,cy+4);

/* ================= Inscriptos y sorteo ================= */
/* Inscriptos: m.inscritos[idTorneo][idCat] = ["Apellido, Nombre", ...]  (en dobles: "Perez, Juan / Lopez, Pedro").
   Sorteo:     m.sorteos[idTorneo][idCat]   = {slots:[...]} con 2, 4, 8, 16 o 32 lugares. Los lugares 2k y 2k+1 se enfrentan
               en la primera ronda. "BYE" = pasa directo, "" = lugar sin asignar.
   Los resultados NO se guardan acá: siguen en m.resultados, y los ganadores avanzan solos en el cuadro. */
const sideKey = n => teamParts(n).map(normName).sort().join("|");
const inscList = (m,tid,cid) => (m.inscritos&&m.inscritos[tid]&&m.inscritos[tid][cid])||[];
const drawOf = (m,tid,cid) => { const s=m.sorteos&&m.sorteos[tid]&&m.sorteos[tid][cid]; return s&&Array.isArray(s.slots)&&DRAW_ROUNDS[s.slots.length]?s:null; };
const drawSizeFor = n => { let s=2; while(s<n) s*=2; return s; };
const seedOrder = size => { let o=[1,2]; while(o.length<size){ const n=o.length*2+1; o=o.flatMap(s=>[s,n-s]); } return o; }; // 1-8, 4-5, 2-7, 3-6...
function resRounds(m,tid,cid){ // las 5 rondas de resultados de una categoría, siempre completas (igual que el panel Resultados)
  m.resultados=m.resultados||{}; m.resultados[tid]=m.resultados[tid]||{};
  m.resultados[tid][cid]=ROUNDS.map(n=>({name:n,m:((m.resultados[tid][cid]||[]).find(r=>r.name===n)||{m:[]}).m}));
  return m.resultados[tid][cid];
}
/* Si el nombre coincide (sin coma, tildes ni mayúsculas) con uno del ranking, usa la grafía del ranking */
function canonName(m,name){
  const known=[...new Set(Object.values(m.ranking||{}).flat().map(r=>r[0]))];
  return teamParts(name).map(p=>{ const k=normName(p); return known.find(x=>normName(x)===k)||p.trim(); }).join(" / ");
}
function inscAdd(m,tid,cid,names){
  m.inscritos=m.inscritos||{}; m.inscritos[tid]=m.inscritos[tid]||{};
  const list=m.inscritos[tid][cid]=m.inscritos[tid][cid]||[]; let added=0, dup=0;
  names.forEach(raw=>{ const nm=canonName(m,String(raw||"").trim()); if(!nm) return;
    if(list.some(x=>sideKey(x)===sideKey(nm))){ dup++; return; }
    list.push(nm); added++; });
  return {added,dup};
}
/* Puntos del ranking de un jugador ANTES de este torneo: los del mismo año (y, de desempate, los de todos los años) */
function seedPoints(m,t,cid,name){
  const k=normName(name), row=(m.ranking[cid]||[]).find(r=>normName(r[0])===k), ti=m.torneos.indexOf(t);
  let y=0, all=0; if(!row) return {y,all};
  m.torneos.forEach((x,i)=>{ if(i>=ti||!applies(x,cid)) return; const v=+row[i+1]||0; all+=v; if(String(x.anio)===String(t.anio)) y+=v; });
  return {y,all};
}
/* Sorteo automático: por defecto todo al azar. Si se tilda "Cabezas de serie": los de más puntos van separados (1 y 2 en mitades opuestas, 3 y 4 al azar en los otros
   cuartos, etc.) y reciben los BYE; el resto se sortea al azar. Sin cabezas de serie, todo al azar. */
function makeDraw(m,t,cid,names,useSeeds){
  const n=names.length, size=drawSizeFor(n);
  const rnd=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const pw=nm=>{ let y=0, all=0; teamParts(nm).forEach(p=>{ const s=seedPoints(m,t,cid,p); y+=s.y; all+=s.all; }); return {nm,y,all}; };
  let seeded=[], rest=rnd(names);
  if(useSeeds){
    const top=rest.map(pw).filter(x=>x.y>0||x.all>0).sort((a,b)=>b.y-a.y||b.all-a.all);
    seeded=top.slice(0,Math.min(size>=32?8:size>=16?4:2,top.length)).map(x=>x.nm);
    rest=rest.filter(x=>!seeded.includes(x));
  }
  const pos=new Array(size+1).fill(""); let k=0;
  [[1],[2],[3,4],[5,6,7,8]].forEach(g=>{ const take=seeded.slice(k,k+g.length); k+=take.length; if(!take.length) return;
    const ps=rnd(g.filter(p=>p<=n)); take.forEach((nm,i)=>{ pos[ps[i]]=nm; }); });
  const free=[]; for(let p=1;p<=n;p++) if(!pos[p]) free.push(p);
  free.forEach((p,i)=>{ pos[p]=rest[i]; });
  return seedOrder(size).map(p=>p<=n?pos[p]:BYE);
}
/* Arma todas las rondas a partir del sorteo y de los resultados cargados: cada partido con sus jugadores, su ganador y su score. */
function drawRounds(m,tid,cid,sd){
  const slots=(sd&&sd.slots)||[], names=DRAW_ROUNDS[slots.length]; if(!names) return null;
  const res=roundsOfM(m,tid,cid), real=x=>x&&x!==BYE; let cur=slots.map(x=>x||"");
  const rounds=names.map(rn=>{
    const pool=((res.find(r=>r.name===rn)||{}).m)||[], matches=[], next=[];
    for(let k=0;k<cur.length;k+=2){
      const a=cur[k], b=cur[k+1], mt={a,b,win:null,bye:false,score:"",ridx:-1};
      if(a===BYE||b===BYE){ mt.bye=true; if(real(a)) mt.win=0; else if(real(b)) mt.win=1; }
      else if(a&&b){ const ka=sideKey(a), kb=sideKey(b);
        const i=pool.findIndex(x=>{ const k0=sideKey(x[0]), k1=sideKey(x[1]); return (k0===ka&&k1===kb)||(k0===kb&&k1===ka); });
        if(i>=0){ mt.ridx=i; mt.win=sideKey(pool[i][0])===ka?0:1; mt.score=pool[i][2]||""; } }
      matches.push(mt);
      next.push(mt.win===0?a:mt.win===1?b:(a===BYE&&b===BYE?BYE:""));
    }
    cur=next; return {name:rn,matches};
  });
  return {rounds,champion:real(cur[0])?cur[0]:""};
}
/* Partido todavía sin jugar: sin score. win (0/1) marca al que pasa directo cuando el rival es BYE. */
function pendingSB(a,b,win){
  const nm=x=>{ if(!x) return '<span class="tbd">A definir</span>'; if(x===BYE) return '<span class="tbd">BYE</span>';
    const s=dispSplit(x); return esc(s.nom ? `${s.ap} ${s.nom.trim()[0].toUpperCase()}.` : s.ap); };
  const row=(x,w)=>`<div class="sb-row${w?" w":""}"><span class="sb-name" title="${esc(x===BYE?"BYE":(x||""))}">${nm(x)}</span><span class="g pad"></span></div>`;
  return `<div class="sb c" style="--n:1">${row(a,win===0)}${row(b,win===1)}</div>`;
}
function drawBracketHTML(m,t,cid,sd){
  const dr=drawRounds(m,t.id,cid,sd); if(!dr) return "";
  const R=dr.rounds.length, size=sd.slots.length;
  const box=mt=>{
    if(mt.bye||mt.win==null) return pendingSB(mt.a,mt.b,mt.bye?mt.win:null);
    const sc=parseScore(mt.score), topWon=mt.win===0;
    return scoreboard(mt.a,mt.b,Array.isArray(sc)&&!topWon?flip(sc):sc,topWon,true,true);
  };
  const cols=dr.rounds.map(rd=>{
    const boxes=rd.matches.map(box); let slots="";
    if(boxes.length===1) slots=`<div class="single">${boxes[0]}</div>`;
    else for(let i=0;i<boxes.length;i+=2) slots+=`<div class="pair">${boxes[i]}${boxes[i+1]}</div>`;
    return `<div class="bcol"><h3>${esc(rd.name)}</h3><div class="slots">${slots}</div></div>`;
  }).join("");
  const ch=dr.champion?dispSplit(dr.champion):null;
  const style=`grid-template-columns:repeat(${R},minmax(0,1fr)) minmax(96px,.78fr);min-height:${Math.max(300,size/2*78)}px${R>=5?";min-width:820px":""}`;
  return `<div class="bracket-box scroll-x"><div class="bracket" style="${style}">${cols}
      <div class="bcol"><h3>Campeón</h3><div class="slots"><div class="single"><div class="champ-card">${icon("trophy")}
        <small>${esc(t.nombre)}, Cat. ${esc(catName(cid,m))}</small><strong>${ch?esc(ch.ap):"A definir"}</strong><small>${ch?esc(ch.nom):""}</small></div></div></div></div></div></div>`;
}

/* --- Panel del administrador --- */
function dmatchHTML(t,c,ri,mi,mt,ins,counts){

/* Ganador y score de un partido cargados desde el sorteo: se guardan en Resultados, así el resto del sitio los ve igual que siempre. */
function drawSetResult(el){
  const m=DM(), {t,c}=state.adminRes, sd=drawOf(m,t,c); if(!sd) return;
  const isWin=el.dataset.dwin!=null, [ri,mi]=String(isWin?el.dataset.dwin:el.dataset.dscore).split(".").map(Number);
  const dr=drawRounds(m,t,c,sd), mt=dr&&dr.rounds[ri]&&dr.rounds[ri].matches[mi];
  if(!mt||!mt.a||!mt.b||mt.a===BYE||mt.b===BYE) return;
  const rounds=resRounds(m,t,c), rd=rounds.find(r=>r.name===dr.rounds[ri].name), ix=mt.ridx;
  const prev=mt.win==null?null:(mt.win===0?mt.a:mt.b);
  if(isWin){
    const v=el.value;
    if(v===""){ if(ix>=0) rd.m.splice(ix,1); }
    else { const w=v==="0"?mt.a:mt.b, l=v==="0"?mt.b:mt.a;
      if(ix>=0){ const e=rd.m[ix], mismo=sideKey(e[0])===sideKey(w); e[0]=w; e[1]=l;
        if(!mismo){ const sc=parseScore(e[2]); if(Array.isArray(sc)){ const f=flip(sc); e[2]=f.map(x=>x.join("-")).join(" ")+(f.ret?(f.length?" ret":"ret"):""); } } }
      else rd.m.push([w,l,""]); }
    const nw=v===""?null:(v==="0"?mt.a:mt.b);
    if(prev&&(!nw||sideKey(nw)!==sideKey(prev))){ // cambió el ganador: lo que jugó después ya no vale
      const gone=new Set([sideKey(prev)]); let removed=0;
      for(let r=ri+1;r<dr.rounds.length;r++){ const nx=rounds.find(x=>x.name===dr.rounds[r].name); if(!nx) continue;
        nx.m=nx.m.filter(e=>{ const k0=sideKey(e[0]), k1=sideKey(e[1]); if(gone.has(k0)||gone.has(k1)){ gone.add(k0); removed++; return false; } return true; }); }
      if(removed) toast(`Se borraron ${removed} resultado${removed===1?"":"s"} de rondas siguientes que dependían de ese ganador`);
    }
  } else if(ix>=0) rd.m[ix][2]=el.value.trim();
  const dr2=drawRounds(m,t,c,sd); // deja los partidos de Resultados en el orden del cuadro
  if(dr2) dr2.rounds.forEach(x=>{ const r=rounds.find(q=>q.name===x.name); if(!r) return;
    const at=e=>{ const k0=sideKey(e[0]), k1=sideKey(e[1]); const i=x.matches.findIndex(q=>q.a&&q.b&&((sideKey(q.a)===k0&&sideKey(q.b)===k1)||(sideKey(q.a)===k1&&sideKey(q.b)===k0))); return i<0?1e6:i; };
    r.m=r.m.map((e,i)=>({e,k:at(e),i})).sort((p,q)=>p.k-q.k||p.i-q.i).map(p=>p.e); });
}

function screenSlides(){
  const out=[], inf=data.info||{};
  if(inf.modo==="canchas" && (inf.horarios||[]).length){
    const all=inf.horarios.filter(h=>h.j1||h.j2||h.hora), hoy=DIAS_ES[new Date().getDay()];
    const de=all.filter(h=>norm(h.dia).includes(hoy)), items=(de.length?de:all).slice();
    const order=[...new Set(items.map(h=>h.dia||""))];
    items.sort((a,b)=>order.indexOf(a.dia||"")-order.indexOf(b.dia||"")||String(a.hora||"").localeCompare(String(b.hora||""),"es",{numeric:true}));
    const pages=chunk(items,12), fecha=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
    pages.forEach((p,k)=>out.push({kind:"sched",secs:15,title:de.length?"Horarios de hoy":(inf.titulo||"Horarios"),
      sub:(de.length?fecha:"")+(pages.length>1?(de.length?" · ":"")+`${k+1}/${pages.length}`:""),html:schedHTML(p)}));
  } else if(inf.modo==="foto" && inf.foto){
    out.push({kind:"photo",secs:15,title:inf.titulo||"Horarios",sub:"",html:`<img class="scr-img" src="${esc(inf.foto)}" alt="${esc(inf.titulo||"Horarios")}">`});
  }
  const picks=[];
  MODCOMBOS().forEach(([key,label])=>{
    const m=data.modalidades[key]; if(!m||!(m.torneos||[]).length) return;
    const live=m.torneos.filter(t=>t.estado==="En juego");
    const fin=m.torneos.filter(t=>t.estado==="Finalizado").sort((a,b)=>String(a.anio||"").localeCompare(String(b.anio||"")));
    const t=live.length?live[live.length-1]:fin[fin.length-1]; // sin nada en juego, el último torneo terminado
    if(t) picks.push({key,label,m,t,live:!!live.length});
  });
  const anyLive=picks.some(p=>p.live); // con un torneo en juego, la tele muestra solo lo que se está jugando
  picks.filter(p=>!anyLive||p.live).forEach(({key,label,m,t})=>{
    tourCats(t,m).forEach(c=>{
      const b=bracketHTML(m,t,c.id), tag=`Cat. ${c.nombre}${key!=="singles-hombres"?" · "+label:""}`;
      if(b){ out.push({kind:"draw",secs:20,title:t.nombre,sub:`Cuadro · ${tag}`,html:b}); return; }
      const rs=roundsOfM(m,t.id,c.id).filter(r=>r.m.length); if(!rs.length) return;

        html:`<div class="matches">${p.map(x=>matchSB(x)).join("")}</div>`}));
    });
  });
  return out;
}

function screenAction(a){

  state.mod=v; store.set("mod",v); state.profile=loadProfile(genKey()); state.view=""; state.picking=false; state.round=0; state.q=""; state.closedTours=null;

  if(r==="#resultados"||r==="#cuadro") location.hash="#torneos"; else render();
  toast(`Mostrando ${modGenLabel().toLowerCase()}`);
}
function setGenero(v){
  if(state.draft) syncDraft();
  state.genero=v; store.set("genero",v); state.profile=loadProfile(genKey()); state.view=""; state.picking=false; state.round=0; state.q=""; state.closedTours=null;
  const r=location.hash.split("/")[0];
  if(r==="#resultados"||r==="#cuadro") location.hash="#torneos"; else render();
  toast(`Mostrando ${modGenLabel().toLowerCase()}`);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-surface],[data-mod],[data-genero],[data-cat],[data-round],[data-photo],[data-sched],[data-player],[data-act],[data-atab],[data-acat],[data-admintab],[data-ttoggle],[data-ayear],[data-atour],[data-share],[data-inscribir],[data-resview],[data-resround],[data-resnav],[data-scr],[data-sorcat]");
  if(!el) return;
  const ds=el.dataset;
  if(ds.surface){ setSurface(ds.surface); return; }
  if(ds.mod){ if(ds.mod!==state.mod) setMod(ds.mod); return; }
  if(ds.genero){ if(ds.genero!==state.genero) setGenero(ds.genero); return; }
  if(ds.share){ shareAction(ds.share,ds.t,ds.c); return; }
  if(ds.inscribir){ openInscribir(ds.inscribir); return; }
  if(ds.sorcat){ syncDraft(); state.adminRes={t:state.adminRes.t,c:ds.sorcat}; render(); return; }
  if(ds.resview){ syncDraft(); state.resView=ds.resview; store.set("resview",ds.resview); render(); return; }
  if(ds.resround!=null){ syncDraft(); state.resRound=+ds.resround; state.resIdx=null; render(); return; }
  if(ds.resnav){ syncDraft(); state.resIdx=(state.resIdx||0)+(+ds.resnav); render(); return; }
  if(ds.scr){ screenAction(ds.scr); return; }
  if(ds.ttoggle){ state.closedTours.has(ds.ttoggle)?state.closedTours.delete(ds.ttoggle):state.closedTours.add(ds.ttoggle); render(); return; }
  if(ds.admintab){ state.adminTab=ds.admintab; if(location.hash==="#admin"){ e.preventDefault(); render(); } return; }
  if(ds.sched!=null){ openSched(); return; }
  if(ds.cat){ state.cat=ds.cat; store.set("cat",ds.cat); render(); return; }
  if(ds.round){ state.round=+ds.round; render(); return; }
  if(ds.photo){ openPhoto(+ds.photo); return; }
  if(ds.player){ state.view=ds.player; state.picking=false; render(); window.scrollTo(0,0); return; }
  if(ds.atab){ syncDraft(); state.adminTab=ds.atab; render(); return; }
  if(ds.acat){ syncDraft(); state.adminCat=ds.acat; render(); return; }
  if(ds.ayear){ syncDraft(); const s2=state.aOpenYears||(state.aOpenYears=new Set()); s2.has(ds.ayear)?s2.delete(ds.ayear):s2.add(ds.ayear); render(); return; }
  if(ds.atour){ syncDraft(); const s2=state.aOpenTours||(state.aOpenTours=new Set()); s2.has(ds.atour)?s2.delete(ds.atour):s2.add(ds.atour); render(); return; }
  if(ds.act){
    const act=ds.act;
    if(act==="profile"){ const n=state.view||state.profile; state.profile=n; store.set("perfil:"+genKey(),n); toast("Guardado como tu perfil"); render(); return; }
    if(act==="unprofile"){ state.view=state.profile; state.profile=""; store.set("perfil:"+genKey(),""); toast("Ya no es tu perfil"); render(); return; }
    if(act==="pick"){ state.picking=true; state.view=""; render(); return; }
    if(act==="rm-foto-jugador"){ const name=state.picking?"":(state.view||state.profile);
      if(!(state.admin||canEditOwnFoto(name))) return;
      if(name&&data.jugadores&&data.jugadores[name]){ delete data.jugadores[name].foto;
        if(saveData()){ if(state.draft) state.draft=clone(data); toast("Foto quitada"); } }
      render(); return; }
    if(act==="logout"||act==="exit-club"){ exitToGate(); return; }
    if(state.admin&&state.draft) adminAction(act,el);
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="loginForm"){ e.preventDefault();
    if(document.getElementById("pass").value===ADMIN_PASS){ state.admin=true; state.loginErr=false; state.draft=clone(data);
      try{sessionStorage.setItem("liga:admin","1")}catch(err){} toast("Ingresaste como administrador"); }
    else state.loginErr=true;
    render(); if(!state.admin){ const p=document.getElementById("pass"); p&&p.focus(); } }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="rankSearch"){ state.q=e.target.value; filterRank(); }
  if(id==="resSearch"){ const q=e.target.value.trim().toLowerCase();
    document.getElementById("roundView").hidden=!!q; const sv=document.getElementById("searchView"); sv.hidden=!q;
    sv.querySelectorAll("[data-m]").forEach(m=>m.hidden=!m.dataset.m.includes(q));
    sv.querySelectorAll("[data-group]").forEach(g=>g.hidden=!g.querySelector("[data-m]:not([hidden])")); }
  if(id==="pickSearch"){ const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll("[data-pn]").forEach(c=>c.hidden=!!q&&!c.dataset.pn.includes(q));
    document.querySelectorAll("[data-pgroup]").forEach(g=>g.hidden=!g.querySelector("[data-pn]:not([hidden])")); }
});
document.addEventListener("change",async e=>{
  const el=e.target, id=el.id;
  if(el.hasAttribute("data-yearsel")){ if(state.draft) syncDraft(); state.anio=el.value; store.set("anio",el.value); state.closedTours=null; state.round=0; render(); return; }
  if(el.hasAttribute("data-rerender")){ syncDraft(); render(); return; }
  if(el.dataset&&(el.dataset.dwin!=null||el.dataset.dscore!=null)){ syncDraft(); drawSetResult(el); render(); return; }
  if(id==="resT"){ syncDraft(); state.adminRes={t:el.value,c:""}; state.resRound=null; state.resIdx=null; render(); return; }
  if(id==="resC"){ syncDraft(); state.adminRes={t:document.getElementById("resT").value,c:el.value}; state.resRound=null; state.resIdx=null; render(); return; }
  if(id==="upInfoFoto"&&el.files[0]){ syncDraft(); try{ state.draft.info.foto=await downscale(el.files[0],1600); state.draft.info.modo="foto"; toast("Foto lista. Tocá Guardar para publicarla."); }catch(err){ toast("No se pudo leer la imagen"); } render(); return; }
  if(id==="upJugadorFoto"&&el.files[0]){
    const name=state.picking?"":(state.view||state.profile); if(!name) return;
    if(!(state.admin||canEditOwnFoto(name))) return;
    try{
      const foto=await downscale(el.files[0],1100);
      if(!data.jugadores) data.jugadores={};
      data.jugadores[name]={...(data.jugadores[name]||{}),foto};
      if(saveData()){ if(state.draft) state.draft=clone(data); toast("Foto actualizada"); } else toast("No se pudo guardar la foto");
    }catch(err){ toast("No se pudo leer la imagen"); }
    render(); return;
  }
  if(id==="pJugadorClub"){
    const name=state.picking?"":(state.view||state.profile); if(!name) return;
    if(!(state.admin||(isCircuitoClub()&&state.profile&&state.profile===name))) return;
    if(!data.jugadores) data.jugadores={};
    data.jugadores[name]={...(data.jugadores[name]||{}),club:el.value.trim()};
    if(saveData()){ if(state.draft) state.draft=clone(data); } 
    render(); return;
  }
  if(id==="upFotos"&&el.files.length){ syncDraft(); let ok=0;
    for(const f of el.files){ try{ state.draft.fotos.push({src:await downscale(f),texto:"",anio:(yearsOf(DM())[0]||String(new Date().getFullYear()))}); ok++; }catch(err){} }
    toast(`${ok} foto${ok===1?"":"s"} lista${ok===1?"":"s"}. Tocá Guardar para publicarlas.`); render(); return; }
  if(id==="importFile"&&el.files[0]){
    if(!CLUB_ID){ toast("Entrá a un club antes de importar"); el.value=""; return; }
    try{ const raw=JSON.parse(await el.files[0].text());
      bkSave("Antes de importar");
      const partial=raw&&raw.modalidades&&!raw.info&&!raw.novedades&&!raw.fotos&&Object.keys(raw.modalidades).every(k=>k.includes("-"));
      if(partial){
        const ks=Object.keys(raw.modalidades);
        if(!confirm(`Este archivo trae: ${ks.map(k=>MODCOMBO_LABEL()[k]||k).join(", ")}. Se reemplaza solo eso en ${clubName()}. ¿Seguir?`)) { el.value=""; return; }
        ks.forEach(k=>{ data.modalidades[k]=raw.modalidades[k]; });
      } else {
        const obj=migrate(raw); if(!obj.modalidades) throw 0;
        if(!confirm(`Este archivo es una copia completa y reemplaza toda la información de ${clubName()}. ¿Seguir?`)) { el.value=""; return; }
        if(!obj.club) obj.club=clone(data.club||DEFAULT_DATA.club); // copias viejas no traen ubicación ni redes: se conservan las actuales
        data=Object.assign(clone(DEFAULT_DATA),obj);
      }
      normalize(data); saveData(); state.draft=clone(data); state.closedTours=null; state.anio=""; toast("Datos importados"); }
    catch(err){ toast("Ese archivo no es una copia válida"); }
    render(); }
});
window.addEventListener("hashchange",()=>{ state.round=0; if(!location.hash.startsWith("#partidos")) state.picking=false; render(); });

/* Lightbox fotos */
const lb=document.getElementById("lb");
function openPhoto(i){
  const list=state.photoList&&state.photoList.length?state.photoList:data.fotos.map((_,k)=>k);
  const n=list.length; if(!n) return; state.photo=(i+n)%n; const f=data.fotos[list[state.photo]];
  document.getElementById("lbFig").innerHTML=f.src?`<img src="${esc(f.src)}" alt="${esc(f.texto||"Foto "+(state.photo+1))}">`:`<span>Foto ${state.photo+1}</span>`;
  document.getElementById("lbCount").textContent=`${state.photo+1} de ${n}${f.texto?`, ${f.texto}`:""}`;
  if(!lb.open) lb.showModal();
}
document.getElementById("lbPrev").onclick=()=>openPhoto(state.photo-1);
document.getElementById("lbNext").onclick=()=>openPhoto(state.photo+1);
document.getElementById("lbClose").onclick=()=>lb.close();
lb.addEventListener("click",e=>{ if(e.target===lb) lb.close(); });
lb.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") openPhoto(state.photo-1); if(e.key==="ArrowRight") openPhoto(state.photo+1); });
/* Visor de horarios */
const sv=document.getElementById("sv"), svBox=document.getElementById("svBox");
function openSched(){ const im=document.getElementById("svImg"); im.src=data.info.foto; im.alt=data.info.titulo;
  document.getElementById("svCap").textContent=data.info.titulo; svBox.classList.remove("zoom"); sv.showModal(); }
const toggleZoom=()=>svBox.classList.toggle("zoom");
document.getElementById("svImg").onclick=toggleZoom;
document.getElementById("svZoom").onclick=toggleZoom;
document.getElementById("svClose").onclick=()=>sv.close();
sv.addEventListener("click",e=>{ if(e.target===sv) sv.close(); });

/* Color de la barra del celular = fondo del tema que esté usando la persona */
(function(){
  const m=document.querySelector('meta[name="theme-color"]'); if(!m) return;
  const sync=()=>{ const c=getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); if(c) m.setAttribute("content",c); };
  new MutationObserver(sync).observe(document.documentElement,{attributes:true,attributeFilter:["data-surface"]});
  sync();
})();

/* Modo sin conexión: sw.js guarda la app para abrirla sin internet. Solo funciona con la app publicada online (https), no como archivo local. */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

render();

/* Si esta pestaña ya tenía una sesión abierta (club o jugador), entra directo sin pedir la clave de nuevo.
   Va al final porque necesita que state y data ya estén cargados. */
cloudInit();

function autoEnterSession(){
  try{
    const sid = sessionStorage.getItem("liga_sesion")||"", i = sid.indexOf(":");
    const rol = i<0?"":sid.slice(0,i), id = i<0?"":sid.slice(i+1);
    if((rol==="admin"||rol==="jugador") && clubStore.get().some(c=>c.id===id)) enterClub(id, rol);
  }catch(e){}
}
(function autoEnter(){
  if(LINK){
    if(tryDeepLink()) return;
    /* celular nuevo: la lista de clubes llega de la nube en unos segundos; si no aparece, se sigue normal */
    setTimeout(()=>{ if(!linkPending) return; linkPending=false; renderGate(); toast("No encontramos el club de ese link"); autoEnterSession(); },9000);
    return;
  }
  autoEnterSession();
})();
</script>
