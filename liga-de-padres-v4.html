<!DOCTYPE html>
<html lang="es" data-surface="polvo" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneos Liga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* ================= Tokens ================= */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --gold:#D9A92B; --silver:#B7C1BB; --bronze:#C98452; --chalk:#FBF8F1; --net:#15191A;
  --line:color-mix(in srgb,var(--text) 13%,transparent);
  --line-strong:color-mix(in srgb,var(--text) 30%,transparent);
  --topbar:color-mix(in srgb,var(--bg) 92%,transparent);
  /* default: polvo oscuro */
  --bg:#1B130F;--surface:#281C15;--surface-2:#33241B;--text:#F6EFE7;--muted:#C7B1A1;
  --accent:#D0652F;--accent-2:#B0521F;--accent-ink:#FFF7EF;--ball:#DDE95B;--ball-ink:#1C2200;
  --win:#8FD9A8;--loss:#F4927F;--court-in:#C0582B;--court-out:#AE4D24;--grain:.28;--mow:0;
}
:root[data-surface="polvo"][data-mode="dark"]{--bg:#1B130F;--surface:#281C15;--surface-2:#33241B;--text:#F6EFE7;--muted:#C7B1A1;--accent:#D0652F;--accent-2:#B0521F;--accent-ink:#FFF7EF;--ball:#DDE95B;--ball-ink:#1C2200;--win:#8FD9A8;--loss:#F4927F}
:root[data-surface="polvo"][data-mode="light"]{--bg:#F4ECE4;--surface:#FFFDFB;--surface-2:#F7EFE7;--text:#2B1A11;--muted:#7B5F4E;--accent:#B8522A;--accent-2:#9A431F;--accent-ink:#FFF7EF;--ball:#C3D431;--ball-ink:#2F3600;--win:#1F8A55;--loss:#C2473A}
:root[data-surface="polvo"]{--court-in:#C0582B;--court-out:#AE4D24;--grain:.28;--mow:0}
:root[data-surface="cesped"][data-mode="dark"]{--bg:#0C2417;--surface:#123220;--surface-2:#193F29;--text:#EFF3EC;--muted:#A3BCA8;--accent:#8457C2;--accent-2:#6C43A6;--accent-ink:#FFFFFF;--ball:#DDE95B;--ball-ink:#1C2200;--win:#8FD9A8;--loss:#F4927F}
:root[data-surface="cesped"][data-mode="light"]{--bg:#ECF3EA;--surface:#FFFFFF;--surface-2:#F2F7F0;--text:#0F2618;--muted:#56705E;--accent:#5B2E8C;--accent-2:#4A2474;--accent-ink:#FFFFFF;--ball:#C3D431;--ball-ink:#2F3600;--win:#1F8A55;--loss:#C2473A}
:root[data-surface="cesped"]{--court-in:#4B8C38;--court-out:#417D30;--grain:.14;--mow:1}
:root[data-surface="dura"][data-mode="dark"]{--bg:#0B1828;--surface:#122338;--surface-2:#192E47;--text:#EEF3F9;--muted:#9EB2C8;--accent:#3C86DB;--accent-2:#2C6FBF;--accent-ink:#FFFFFF;--ball:#DDE95B;--ball-ink:#1C2200;--win:#8FD9A8;--loss:#F4927F}
:root[data-surface="dura"][data-mode="light"]{--bg:#E9F0F8;--surface:#FFFFFF;--surface-2:#F1F5FA;--text:#0E1E32;--muted:#52667E;--accent:#1F5FAE;--accent-2:#194E90;--accent-ink:#FFFFFF;--ball:#C3D431;--ball-ink:#2F3600;--win:#1F8A55;--loss:#C2473A}
:root[data-surface="dura"]{--court-in:#2D66A3;--court-out:#3A7753;--grain:.1;--mow:0}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);transition:background-color .4s ease,color .4s ease;
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.display{font-stretch:68%;font-weight:850;line-height:.92;letter-spacing:-.005em;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}

/* ================= Top bar ================= */
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;flex:none;min-width:34px}
.brand-mark{width:34px;height:22px;border-radius:3px;background:var(--court-in);position:relative;flex:none;box-shadow:inset 0 0 0 2px var(--chalk);transition:background-color .4s}
.brand-mark::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--net)}
.brand b{font-stretch:70%;font-weight:850;font-size:1.3rem;white-space:nowrap}
.brand .city{color:var(--muted);font-size:.9rem}
.nav{display:flex;gap:2px}
.nav a{white-space:nowrap;text-decoration:none;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.95rem;position:relative}
.nav a:hover,.nav a[aria-current="page"]{color:var(--text)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:-11px;height:3px;background:var(--accent);border-radius:3px}
.swatches{display:flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:99px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{border-color:var(--text)}
.sw-polvo{background:#C0582B}.sw-cesped{background:#4B8C38}.sw-dura{background:#2D66A3}
.theme-btn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.theme-btn:hover{color:var(--text)}
.adminbar{background:var(--ball);color:var(--ball-ink);font-size:.85rem;font-weight:700}
.adminbar .wrap{display:flex;align-items:center;gap:14px;min-height:34px}
.adminbar a,.adminbar button{color:inherit;background:none;border:0;cursor:pointer;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:0}
.adminbar span{margin-right:auto}
.tabbar{display:none}
@media (max-width:900px){
  .nav{display:none}.brand .city{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--topbar);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:600;white-space:nowrap}
  .tabbar a[aria-current="page"]{color:var(--text)}
  .tabbar a[aria-current="page"] svg{color:var(--accent)}
  .tabbar a[aria-current="page"] svg .fill{fill:var(--ball);stroke:var(--ball-ink)}
  main{padding-bottom:84px}
}

/* ================= Shared ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:700;font-size:.95rem;
  text-decoration:none;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ball{background:var(--ball);color:var(--ball-ink)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--loss);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--loss) 60%,transparent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:nowrap}
.seg button,.seg a{border:0;background:none;padding:7px 13px;border-radius:7px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);text-decoration:none;white-space:nowrap}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--text);color:var(--bg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:40px;color:var(--muted)}
.search input{border:0;background:none;outline:none;width:170px;color:var(--text)}
.search svg.i{width:18px;height:18px}
.page{padding-top:30px;padding-bottom:44px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:20px}
.page-head h1{font-size:clamp(2.6rem,7vw,4.4rem)}
.page-head .sub{color:var(--muted);margin:6px 0 0;font-size:1.05rem}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:.84rem;color:var(--muted);margin-top:14px}
.edit-link{font-size:.82rem;font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;padding:34px 24px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:1.15rem;margin-bottom:6px}
.empty .btn{margin-top:16px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.round-label{font-stretch:75%;font-weight:800;font-size:1.2rem;margin:26px 0 10px}
.pill{display:inline-grid;place-items:center;min-width:2.5rem;height:1.75rem;padding:0 6px;border-radius:6px;font-weight:750;font-size:.9rem;font-variant-numeric:tabular-nums;font-stretch:88%}
.p100{background:var(--gold);color:#2A1E00}.p80{background:var(--silver);color:#15201A}.p60{background:var(--bronze);color:#2A1406}
.p40{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-strong)}.p20{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.p10{color:var(--muted);opacity:.75}.p0{color:var(--muted);opacity:.5;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:60;
  background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:700;pointer-events:none;transition:all .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:900px){.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}

/* ================= Home ================= */
.hero{padding-top:36px}
.hero h1{font-size:clamp(3.2rem,11vw,7.5rem)}
.lede{font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--muted);margin:14px 0 26px;max-width:42ch}
.court-wrap{position:relative;border-radius:12px;overflow:hidden;background:var(--court-out)}
.court{display:block;width:100%;height:auto}
.surf{transition:fill .45s ease,opacity .45s ease}
.court .lines *{fill:none;stroke:var(--chalk);stroke-width:9;stroke-dasharray:1;stroke-dashoffset:0}
.court.draw .lines *{animation:chalk 1.4s cubic-bezier(.6,.1,.2,1) both}
.court.draw .lines *:nth-child(n+2){animation-delay:.25s}
.court.draw .lines *:nth-child(n+4){animation-delay:.45s}
@keyframes chalk{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.overlay{position:absolute;left:6%;right:6%;top:10%;bottom:10%;display:grid;grid-template-columns:1fr 1fr}
.half{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:0 6%;
  text-shadow:0 2px 0 rgba(0,0,0,.28),0 0 16px rgba(0,0,0,.6),0 0 4px rgba(0,0,0,.45);background:radial-gradient(closest-side,rgba(0,0,0,.26),rgba(0,0,0,0))}
.half .cat{font-weight:800;font-size:clamp(.78rem,1.5vw,1.05rem)}
.half .champ{font-stretch:66%;font-weight:900;font-size:clamp(1.35rem,5vw,3.4rem);line-height:.95;margin-top:4px}
.half .first{font-size:clamp(.85rem,1.7vw,1.15rem);font-weight:700}
.half .detail{margin-top:10px;font-size:.92rem;font-weight:600;background:rgba(0,0,0,.45);padding:4px 12px;border-radius:99px;text-shadow:none}
.court-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.court-caption{display:none;color:var(--muted);font-size:.95rem;margin:0}
.court-bar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.court-bar .lbl{font-size:.85rem;color:var(--muted)}
.court-bar .seg button{padding:6px 12px;font-size:.85rem}
@media (max-width:600px){.half .detail{display:none}.court-caption{display:block}}

.info{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.info-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.info h2{display:flex;align-items:center;gap:8px;font-stretch:72%;font-weight:850;font-size:1.6rem;line-height:1;margin:0}
.info h2 svg{color:var(--accent)}
.info p{margin:0;font-size:1.05rem;max-width:70ch}
.info.photo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:26px;align-items:center}
@media (max-width:760px){.info.photo{grid-template-columns:1fr}}
.sched-title{font-stretch:75%;font-weight:800;font-size:1.25rem;margin:22px 0 4px;padding-top:18px;border-top:1px solid var(--line)}
.day h3{font-size:.95rem;font-weight:700;color:var(--muted);margin:12px 0 8px}
.day-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
@media (max-width:600px){.day-row{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:80%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
  .day-row > *{scroll-snap-align:start}}
.sched{border:0;padding:0;background:none;cursor:zoom-in;display:block;width:100%}
.sched .thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sched img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.sched-foot{margin-top:8px;font-weight:750;font-size:.95rem}
.sched-foot small{color:var(--muted);font-weight:500;margin-left:6px}

/* Mini court */
.mc{position:relative;border-radius:10px;overflow:hidden;background:var(--court-out);transition:background-color .45s;container-type:inline-size}
.mc svg{display:block;width:100%;height:auto}
.mc .mc-top,.mc .mc-bottom{position:absolute;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;font-size:.74rem;font-weight:800;color:#fff}
.mc .mc-top{top:6px}.mc .mc-bottom{bottom:5px;justify-content:center}
.mc .tag{background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px;white-space:nowrap}
.mc .tag.gold{background:var(--gold);color:#2A1E00}
.mc .mc-sides{position:absolute;left:7%;right:7%;top:21%;bottom:15%;display:grid;grid-template-columns:1fr 1fr}
.mc .side{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;min-width:0}
.mc .side:first-child{padding:0 9px 0 2px}.mc .side:last-child{padding:0 2px 0 9px}
.mc .plate{display:flex;flex-direction:column;align-items:center;max-width:100%;min-width:0;background:rgba(8,12,10,.72);
  border-radius:7px;padding:4px 9px 5px;box-shadow:0 2px 8px rgba(0,0,0,.25);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.mc .plate b{font-stretch:72%;font-weight:850;font-size:clamp(.82rem,5cqi,1.6rem);line-height:1.05;max-width:100%;white-space:normal;text-align:center}
.mc .plate small{font-size:clamp(.66rem,3.4cqi,.95rem);font-weight:600;opacity:.8;line-height:1.15}
.mc .side.lose .plate{background:rgba(8,12,10,.5)}
.mc .side.lose .plate b{font-weight:700;opacity:.88}
.mc .side.win .plate{box-shadow:inset 0 0 0 1.5px var(--gold),0 2px 8px rgba(0,0,0,.3)}
.mc .side .tro{width:clamp(16px,6cqi,26px);height:clamp(16px,6cqi,26px);color:var(--gold);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));margin-bottom:3px}

.mod-tag{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:99px;
  vertical-align:middle;margin-left:8px;letter-spacing:0;font-stretch:100%;line-height:1.3}
h1 .mod-tag{font-size:.9rem;vertical-align:.9em}
.modseg button{padding:6px 11px;font-size:.85rem}
.mod-pick{display:flex;align-items:center;gap:10px;margin:-4px 0 16px;color:var(--muted);font-size:.9rem;font-weight:600}
.cat-group{margin-top:20px}
.cat-group + .cat-group{padding-top:18px;border-top:1px dashed var(--line)}
.cat-h{display:flex;align-items:center;gap:8px;font-stretch:75%;font-weight:850;font-size:1.3rem;margin:0}
.cat-h::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--court-in);box-shadow:inset 0 0 0 1.5px var(--chalk)}
.day h4{font-size:.85rem;font-weight:700;color:var(--muted);margin:10px 0 6px}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.champ-mini{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:12px 14px}
.champ-mini small{color:var(--muted);font-weight:700;display:block;font-size:.8rem}
.champ-mini strong{font-stretch:72%;font-weight:900;font-size:1.5rem;line-height:1.05;display:block}
.champ-mini span{color:var(--muted);font-size:.85rem}
@media (max-width:1120px){.brand .city{display:none}}
@media (max-width:560px){.brand b{display:none}.topbar .wrap{gap:8px}.modseg button{padding:5px 8px;font-size:.78rem}
  .swatch{width:18px;height:18px}.swatches{gap:4px;padding:3px}.theme-btn{width:34px;height:34px}}

.news{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.news-item{border-radius:12px;padding:22px 22px 20px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.news-item h2{font-stretch:72%;font-weight:850;font-size:1.7rem;line-height:1;margin:0 0 8px}
.news-item p{margin:0 0 16px;color:var(--muted);max-width:48ch}
.news-item.destacada{background:var(--net);color:var(--chalk);border:0}
.news-item.destacada p{color:rgba(251,248,241,.75)}
.news-item.destacada::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--ball);box-shadow:inset -18px -10px 0 rgba(0,0,0,.08)}
.news-item.destacada > *{position:relative;z-index:1;max-width:calc(100% - 90px)}
.section-title{font-stretch:72%;font-weight:850;font-size:1.6rem;margin:40px 0 8px}
.explore{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.row:first-child{border-top:1px solid var(--line)}
.row .row-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.row strong{display:block;font-stretch:78%;font-weight:800;font-size:1.2rem}
.row .row-text span{color:var(--muted);font-size:.95rem}
.row .chev{margin-left:auto;color:var(--muted)}
.row:hover strong{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--accent)}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-top:34px;padding-bottom:40px;color:var(--muted);font-size:.85rem}
.foot a{color:var(--muted)}

/* ================= Ranking ================= */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.82rem;color:var(--muted);margin:0 0 14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .pill{min-width:2rem;height:1.4rem;font-size:.75rem}
.table-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.rank{width:100%;border-collapse:collapse}
.rank th{font-size:.78rem;font-weight:700;color:var(--muted);text-align:center;padding:12px 6px;border-bottom:1px solid var(--line)}
.rank th.left{text-align:left}
.rank td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.rank tr:last-child td{border-bottom:0}
.rank td.player{text-align:left}
.ap{font-weight:750}.nom{color:var(--muted)}
.rank .star{color:var(--gold);margin-left:4px;font-size:.85rem}
.rank .total{font-stretch:75%;font-weight:900;font-size:1.35rem;font-variant-numeric:tabular-nums;text-align:right;padding-right:18px}
.pos{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.pos.m1{background:var(--gold);color:#2A1E00}.pos.m2{background:var(--silver);color:#15201A}.pos.m3{background:var(--bronze);color:#2A1406}
.rank tr.me td{background:color-mix(in srgb,var(--ball) 18%,transparent)}
.me-tag{display:inline-block;margin-left:6px;background:var(--ball);color:var(--ball-ink);font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:99px;vertical-align:1px}
.rank tr.cut td{padding:0;border-bottom:0}
.cut-line{display:flex;align-items:center;padding:6px 16px;font-size:.78rem;font-weight:700;color:var(--gold);
  background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 18px) center/100% 2px no-repeat}
.cut-line span{background:var(--surface);padding:0 8px;margin:0 auto}
.long{display:inline}.short{display:none}
@media (max-width:600px){
  .long{display:none}.short{display:inline}
  .rank th,.rank td{padding-left:3px;padding-right:3px}
  .rank .nom{display:block;font-size:.82rem;line-height:1.2}
  .pill{min-width:2.1rem;height:1.6rem;font-size:.82rem}
  .rank .total{padding-right:12px;font-size:1.2rem}
  .search input{width:120px}
}

/* ================= Torneos ================= */
.timeline{position:relative;padding-left:48px}
.timeline::before{content:"";position:absolute;left:16px;top:10px;bottom:10px;width:2px;background:var(--line-strong)}
.tcard{position:relative;margin-bottom:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.tnode{position:absolute;left:-48px;top:22px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:850;font-stretch:80%;box-shadow:0 0 0 5px var(--bg)}
.tcard.live .tnode{background:var(--ball);color:var(--ball-ink)}
.thead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:16px}
.thead h2{font-stretch:66%;font-weight:900;font-size:clamp(2.1rem,5vw,3.2rem);line-height:.9;margin:0}
.thead .dates{color:var(--muted)}
.chip{margin-left:auto;font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.fin{color:var(--win)}.chip.live{background:var(--ball);color:var(--ball-ink)}
.tfinals{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.tfinal .actions{display:flex;gap:8px;margin-top:10px}
@media (max-width:640px){.timeline{padding-left:0}.timeline::before,.tnode{display:none}}

/* ================= Scoreboards ================= */
.sb{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sb-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),2.5rem);align-items:stretch;min-height:2.7rem}
.sb-row + .sb-row{border-top:1px solid var(--line)}
.sb-name{padding:.55rem .9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);align-self:center}
.sb-name::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.55rem;vertical-align:1px;background:transparent}
.sb-row.w .sb-name{color:var(--text);font-weight:750}
.sb-row.w .sb-name::before{background:var(--ball);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.g{display:grid;place-items:center;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;font-stretch:85%;font-size:1.08rem;font-weight:600;color:var(--muted)}
.g.won{color:var(--text);font-weight:850}.g.st{background:var(--surface-2);font-size:.92rem}.g.wo{font-size:.8rem;font-weight:800;color:var(--text)}
.sb.c .sb-row{grid-template-columns:minmax(0,1fr) repeat(var(--n),1.7rem);min-height:2.05rem}
.sb.c .sb-name{padding:.3rem .6rem;font-size:.86rem}
.sb.c .sb-name::before{width:.42rem;height:.42rem;margin-right:.4rem}
.sb.c .g{font-size:.86rem}
.matches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.matches{grid-template-columns:1fr}}
.tabs-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:16px}

/* Bracket */
.bracket-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr)) minmax(170px,.8fr);column-gap:36px;min-width:1080px;height:700px}
.bcol{display:flex;flex-direction:column;min-height:0}
.bcol h3{margin:0 0 8px;font-size:.85rem;font-weight:700;color:var(--muted);height:1.4rem}
.slots{flex:1;display:grid;grid-auto-rows:1fr;min-height:0}
.pair{display:grid;grid-template-rows:1fr 1fr;position:relative}
.pair > .sb{align-self:center}
.pair::after{content:"";position:absolute;right:-18px;top:25%;bottom:25%;width:18px;border:2px solid var(--line-strong);border-left:0;border-radius:0 6px 6px 0}
.pair::before{content:"";position:absolute;right:-36px;top:50%;width:18px;border-top:2px solid var(--line-strong)}
.single{display:grid;align-items:center;position:relative}
.single::after{content:"";position:absolute;right:-36px;top:50%;width:36px;border-top:2px solid var(--line-strong)}
.bcol:last-child .single::after{display:none}
.champ-card{align-self:center;background:var(--gold);color:#2A1E00;border-radius:12px;padding:16px;text-align:center}
.champ-card svg{width:30px;height:30px}
.champ-card small{display:block;font-weight:700;font-size:.8rem;opacity:.8}
.champ-card strong{display:block;font-stretch:70%;font-weight:900;font-size:1.6rem;line-height:1}

/* ================= Mis partidos ================= */
.picker h1{font-size:clamp(2.6rem,8vw,4.6rem)}
.picker p{color:var(--muted);max-width:52ch;font-size:1.05rem;margin:10px 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:600}
.pchip:hover{border-color:var(--accent)}
.pchip .nom{font-weight:500}
.pcard{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pc-main{padding:24px;display:flex;flex-direction:column;gap:6px}
.pc-main h1{font-size:clamp(2.6rem,7vw,4.2rem)}
.pc-main .sub{color:var(--muted);font-weight:600;font-size:1.1rem}
.pc-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:16px}
.pc-rank{position:relative;background:var(--court-in);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:190px;text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 14px rgba(0,0,0,.4);transition:background-color .45s}
.pc-rank::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.75)}
.pc-rank::after{content:"";position:absolute;left:14px;right:14px;top:50%;border-top:2px solid rgba(255,255,255,.4)}
.pc-rank b{position:relative;z-index:1;font-stretch:62%;font-weight:900;font-size:5.4rem;line-height:.9}
.pc-rank span{position:relative;z-index:1;font-weight:700;background:rgba(0,0,0,.35);padding:2px 10px;border-radius:99px;text-shadow:none;font-size:.9rem;margin-top:6px}
@media (max-width:640px){.pcard{grid-template-columns:1fr}.pc-rank{min-height:150px}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.stat{padding:16px 18px}.stat + .stat{border-left:1px solid var(--line)}
.stat b{display:block;font-stretch:66%;font-weight:900;font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.tracks{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 20px}
.track{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 3rem;align-items:center;gap:16px;padding:16px 0}
.track + .track{border-top:1px solid var(--line)}
.track .tname{font-stretch:78%;font-weight:800;font-size:1.1rem;line-height:1.1}
.track .tname small{display:block;font-stretch:100%;font-weight:600;color:var(--muted);font-size:.8rem}
.nodes{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.nodes::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:8px;height:3px;background:var(--line)}
.nodes .fillbar{position:absolute;left:calc(100%/12);top:8px;height:3px;background:var(--win);width:var(--w)}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:.72rem;color:var(--muted);font-weight:600}
.node i{width:19px;height:19px;border-radius:50%;background:var(--surface);border:3px solid var(--line-strong);display:block}
.node.on i{background:var(--win);border-color:var(--win)}
.node.on{color:var(--text)}
.node.out i{background:var(--surface);border-color:var(--loss)}
.node.out{color:var(--loss)}
.node.champ i{background:var(--gold);border-color:var(--gold)}
.track.skip .nodes{opacity:.35}
@media (max-width:560px){.track{grid-template-columns:1fr 3rem}.track .nodes{grid-column:1/-1;grid-row:2}.node{font-size:.62rem}}
.mlist{display:flex;flex-direction:column;gap:10px}
.mmeta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:5px;padding:0 2px}
.res-w{color:var(--win);font-weight:800}.res-l{color:var(--loss);font-weight:800}

/* ================= Fotos ================= */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:150px;grid-auto-flow:dense;gap:8px}
.ph{border:0;border-radius:8px;cursor:pointer;position:relative;overflow:hidden;padding:0;display:grid;place-items:center;color:rgba(251,248,241,.9);background:var(--court-in)}
.ph.big{grid-column:span 2;grid-row:span 2}.ph.tall{grid-row:span 2}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.empty-ph::before{content:"";position:absolute;inset:18% 12%;border:2px solid rgba(251,248,241,.35)}
.ph.empty-ph::after{content:"";position:absolute;left:50%;top:18%;bottom:18%;border-left:2px solid rgba(251,248,241,.35)}
.ph span{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.85rem}
.v1{background:color-mix(in srgb,var(--court-in) 80%,#000)}.v2{background:color-mix(in srgb,var(--court-out) 75%,#fff)}
.v3{background:color-mix(in srgb,var(--court-in) 65%,#000)}.v4{background:color-mix(in srgb,var(--accent) 70%,#000)}
dialog.lb{border:0;padding:0;background:transparent;max-width:min(92vw,980px);width:100%;color:var(--chalk)}
dialog.lb::backdrop{background:rgba(5,10,8,.88)}
.lb-fig{margin:0;border-radius:10px;overflow:hidden;background:var(--court-in);min-height:40vh;display:grid;place-items:center;position:relative}
.lb-fig img{display:block;max-width:100%;max-height:78vh;margin:0 auto}
.lb-fig span{font-weight:800;font-size:1.3rem}
.lb-bar{display:flex;align-items:center;gap:10px;margin-top:12px}
.lb-bar button{background:rgba(251,248,241,.14);border:0;border-radius:8px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--chalk)}
.lb-bar .count{margin-right:auto;font-weight:600}
.sv-box{max-height:80vh;overflow:auto;border-radius:10px;background:#fff}
.sv-box img{display:block;width:100%;height:auto;cursor:zoom-in}
.sv-box.zoom img{width:220%;max-width:none;cursor:zoom-out}

/* ================= Admin ================= */
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px}
.login h1{font-size:2.4rem;margin-bottom:6px}
.login p{color:var(--muted);margin:0 0 18px}
.err{color:var(--loss);font-weight:700;font-size:.9rem;margin-top:10px}
.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea,.cell input,.cell select{border:1px solid var(--line-strong);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:500;font-size:.95rem;color:var(--text);width:100%}
.f textarea{min-height:110px;resize:vertical;line-height:1.45}
.admin-tabs{margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:18px}
.panel h2{font-stretch:75%;font-weight:850;font-size:1.4rem;margin:0}
.panel .hint{color:var(--muted);font-size:.88rem;margin:-10px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.block{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.block-head{display:flex;align-items:center;gap:8px}
.block-head strong{margin-right:auto;font-stretch:80%;font-size:1.1rem}
.icon-btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn.del{color:var(--loss)}
.icon-btn svg.i{width:17px;height:17px}
.etable{width:100%;border-collapse:collapse;min-width:640px}
.etable th{font-size:.75rem;color:var(--muted);text-align:left;padding:6px 4px;font-weight:700}
.etable td{padding:4px}
.cell input,.cell select{padding:6px 8px;font-size:.9rem}
.save-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:16px;
  background:var(--topbar);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.save-bar span{margin-right:auto;color:var(--muted);font-size:.85rem}
@media (max-width:900px){.save-bar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
.photo-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.photo-admin .pa{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pa .pa-img{aspect-ratio:4/3;background:var(--court-in);position:relative;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem}
.pa .pa-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pa .pa-body{padding:8px;display:flex;gap:6px;align-items:center}
.pa .pa-body input{flex:1;min-width:0;border:1px solid var(--line-strong);background:var(--bg);border-radius:6px;padding:5px 7px;font-size:.85rem}
.preview-img{max-width:320px;border-radius:8px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

const store = {

  set(k,v){try{localStorage.setItem("liga:"+k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem("liga:"+k)}catch(e){}}
};
const clone = o => JSON.parse(JSON.stringify(o));
function migrate(o){ // convierte datos de la versión anterior (sin modalidades)
  if(o.modalidades) return o;
  const d=clone(DEFAULT_DATA);
  if(o.info){ d.info=o.info; d.info.horarios=(o.info.horarios||[]).map(h=>({mod:"singles",...h})); }
  if(o.novedades) d.novedades=o.novedades;
  if(o.fotos) d.fotos=o.fotos;
  if(o.torneos&&o.ranking){
    const ids=Object.keys(o.ranking);
    d.modalidades.singles={categorias:ids.map(id=>({id,nombre:id})),
      torneos:o.torneos.map(t=>{const f={}; ids.forEach(id=>f[id]=t[id]||{champ:"",fin:""}); const {B,C,...rest}=t; return {...rest,finales:f};}),
      ranking:o.ranking,resultados:o.resultados||{}};
  }
  return d;
}

const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2br = s => esc(s).replace(/\n/g,"<br>");
const split = full => { const i=String(full).indexOf(", "); return i<0?{ap:String(full),nom:""}:{ap:full.slice(0,i),nom:full.slice(i+2)}; };
const nameHTML = full => { const s=split(full); return `<span class="ap">${esc(s.ap)}</span>${s.nom?` <span class="nom">${esc(s.nom)}</span>`:""}`; };
const pill = p => p==null||p==="" ? `<span class="pill p0">—</span>` : `<span class="pill p${p}" title="${PTS[p]||""}">${p}</span>`;
const joinY = arr => arr.length<2?arr.join(""):arr.slice(0,-1).join(", ")+" y "+arr[arr.length-1];
function parseScore(str){
  if(str==null||str==="") return null;
  const t=String(str).trim().toUpperCase().replace(/\./g,"");
  if(t==="WO") return "WO";
  const sets=t.split(/\s+/).map(x=>x.split("-").map(Number));
  return sets.every(s=>s.length===2&&s.every(Number.isFinite))?sets:null;
}
const flip = sets => sets.map(([a,b])=>[b,a]);

function ranked(cat,m=M()){ // posiciones sin empates: manda el total y, si empatan, el orden de la lista
  return (m.ranking[cat]||[]).map((r,i)=>({name:r[0],pts:r.slice(1),i,total:r.slice(1).reduce((a,b)=>a+(+b||0),0)}))
    .sort((a,b)=>b.total-a.total||a.i-b.i).map((r,k)=>({...r,pos:k+1}));
}
function findPlayer(name){
  for(const c of cats()){ const r=ranked(c.id).find(x=>x.name===name); if(r) return {cat:c.id,...r}; }
  return null;
}
function roundsOf(tid,cat){ const r=M().resultados[tid]; return (r&&r[cat])||[]; }
function playerMatches(name){
  const out=[];
  M().torneos.forEach(t=>cats().forEach(c=>roundsOf(t.id,c.id).forEach(r=>r.m.forEach(m=>{
    if(m[0]!==name&&m[1]!==name) return;
    const sc=parseScore(m[2]), won=m[0]===name;
    out.push({torneo:t.nombre,cat:c.id,round:r.name,opp:won?m[1]:m[0],won,sets:sc==="WO"?"WO":sc?(won?sc:flip(sc)):null});
  }))));
  return out;
}
function latestFinished(){
  const ts=M().torneos;
  for(let i=ts.length-1;i>=0;i--){ const t=ts[i]; if(t.estado==="Finalizado"&&cats().some(c=>t.finales[c.id]&&t.finales[c.id].champ)) return t; }
  return null;
}

function scoreboard(a,b,sets,aWon,compact=false,short=false){
  const nm = n => esc(short ? split(n).ap : n);
  let n=1,rowA="",rowB="";
  if(sets==="WO"){
    rowA = aWon?'<span class="g wo">W.O.</span>':'<span class="g"></span>';
    rowB = aWon?'<span class="g"></span>':'<span class="g wo">W.O.</span>';
  } else if(!sets){
    rowA = rowB = '<span class="g" title="Score sin cargar">–</span>';
  } else {
    n=sets.length;
    sets.forEach(([x,y])=>{ const st=Math.max(x,y)>=10?" st":"", t=st?' title="Super tie-break"':"";
      rowA+=`<span class="g${x>y?" won":""}${st}"${t}>${x}</span>`; rowB+=`<span class="g${y>x?" won":""}${st}"${t}>${y}</span>`; });
  }
  return `<div class="sb${compact?" c":""}" style="--n:${n}">
    <div class="sb-row${aWon?" w":""}"><span class="sb-name" title="${esc(a)}">${nm(a)}</span>${rowA}</div>
    <div class="sb-row${aWon?"":" w"}"><span class="sb-name" title="${esc(b)}">${nm(b)}</span>${rowB}</div></div>`;
}
const matchSB = (m,compact) => scoreboard(m[0],m[1],parseScore(m[2]),true,compact);

function schedGroups(list){
  // agrupa por modalidad + categoría respetando el orden de las categorías
  const groups=[];
  MODS.forEach(([mod])=>{
    const m=data.modalidades[mod]; if(!m) return;
    const ids=[...m.categorias.map(c=>c.id),""];
    ids.forEach(id=>{ const items=list.filter(h=>(h.mod||"singles")===mod&&(h.cat||"")===id); if(items.length) groups.push({mod,id,
      nombre:id?`Categoría ${(m.categorias.find(c=>c.id===id)||{nombre:id}).nombre}`:"Sin categoría",items}); });
    const known=new Set(ids); const orphan=list.filter(h=>(h.mod||"singles")===mod&&!known.has(h.cat||""));
    if(orphan.length) groups.push({mod,id:"?",nombre:"Otras categorías",items:orphan});
  });
  return groups;
}

function resolveTour(tid,c){

function vCuadro(tid,c){
  const {t,cid}=resolveTour(tid,c);
  if(!t||!cid) return vTorneos();
  const all=roundsOf(t.id,cid), names=["Octavos","Cuartos","Semifinal","Final"], need=[8,4,2,1];
  const rounds=names.map(n=>all.find(r=>r.name===n));
  if(!rounds.every((r,i)=>r&&r.m.length===need[i])) return `<section class="wrap page">${tourHead(t,cid,"draw")}<div class="empty"><strong>El cuadro todavía no está completo</strong>
    Para dibujarlo hacen falta todos los cruces desde octavos. Mientras tanto podés ver los partidos cargados.<br>
    <a class="btn ghost" href="#resultados/${t.id}/${cid}">Ver resultados</a></div></section>`;
  const winners=[];
  const cols=rounds.map((rd,ri)=>{
    const boxes=rd.m.map((m,mi)=>{
      let top=m[0],bot=m[1];
      if(ri>0){ const a=winners[ri-1][mi*2], b=winners[ri-1][mi*2+1]; if([a,b].includes(m[0])&&[a,b].includes(m[1])){top=a;bot=b;} }
      (winners[ri]||(winners[ri]=[]))[mi]=m[0];
      const sc=parseScore(m[2]), topWon=top===m[0];
      return scoreboard(top,bot,Array.isArray(sc)&&!topWon?flip(sc):sc,topWon,true,true);
    });
    let slots=""; if(boxes.length===1) slots=`<div class="single">${boxes[0]}</div>`;
    else for(let i=0;i<boxes.length;i+=2) slots+=`<div class="pair">${boxes[i]}${boxes[i+1]}</div>`;
    return `<div class="bcol"><h3>${rd.name}</h3><div class="slots">${slots}</div></div>`;
  }).join("");
  const ch=split(rounds[3].m[0][0]);
  return `<section class="wrap page">${tourHead(t,cid,"draw")}
    <div class="bracket-box scroll-x"><div class="bracket">${cols}
      <div class="bcol"><h3>Campeón</h3><div class="slots"><div class="single"><div class="champ-card">${icon("trophy")}
        <small>${esc(t.nombre)}, Cat. ${esc(catName(cid))}</small><strong>${esc(ch.ap)}</strong><small>${esc(ch.nom)}</small></div></div></div></div></div></div>
    <p class="note">El cuadro arranca en octavos. Los 16avos están en <a href="#resultados/${t.id}/${cid}">Resultados</a>.</p></section>`;
}

/* --- draft helpers --- */
function setPath(obj,path,val){ const k=path.split("."); let o=obj; for(let i=0;i<k.length-1;i++){ o=o[k[i]]; if(o==null) return; } o[k[k.length-1]]=val; }
function syncDraft(){
  if(!state.draft) return;
  document.querySelectorAll("[data-bind]").forEach(el=>{
    let v=el.value; if(el.dataset.type==="pts") v = v===""?null:Number(v);
    setPath(state.draft,el.dataset.bind,v);
  });
}
function downscale(file,max=1400){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",.82)); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file); });
}
const swap=(arr,i,j)=>{ if(j<0||j>=arr.length) return; [arr[i],arr[j]]=[arr[j],arr[i]]; };

function adminAction(act,el){
  const d=state.draft, m=DM(), i=el.dataset.i!=null?el.dataset.i:null, n=+i;
  syncDraft();
  switch(act){
    case "add-h": d.info.horarios.push({dia:"Sábado",hora:"",cancha:"Cancha 1",mod:state.mod,cat:(m.categorias[0]||{}).id||"",j1:"",j2:""}); break;
    case "del-h": d.info.horarios.splice(n,1); break;
    case "del-infofoto": d.info.foto=""; break;
    case "add-n": d.novedades.push({titulo:"Nueva tarjeta",texto:"",boton:"",link:"",estilo:"simple"}); break;
    case "del-n": d.novedades.splice(n,1); break;
    case "up-n": swap(d.novedades,n,n-1); break;
    case "down-n": swap(d.novedades,n,n+1); break;
    case "add-c": { const id="k"+Date.now().toString(36); m.categorias.push({id,nombre:"Nueva"}); m.ranking[id]=[];
      m.torneos.forEach(t=>t.finales[id]={champ:"",fin:""}); break; }
    case "del-c": { const c=m.categorias[n];
      if(!confirm(`¿Borrar la Cat. ${c.nombre} de ${MOD_LABEL[state.mod].toLowerCase()}? Se borran su ranking, sus finales y sus resultados.`)) return;
      m.categorias.splice(n,1); delete m.ranking[c.id]; m.torneos.forEach(t=>delete t.finales[c.id]);
      Object.values(m.resultados).forEach(r=>delete r[c.id]);
      d.info.horarios.forEach(h=>{ if((h.mod||"singles")===state.mod&&h.cat===c.id) h.cat=""; }); break; }
    case "up-c": swap(m.categorias,n,n-1); break;
    case "down-c": swap(m.categorias,n,n+1); break;
    case "add-t": { const f={}; m.categorias.forEach(c=>f[c.id]={champ:"",fin:""});
      m.torneos.push({id:"t"+Date.now().toString(36),etiqueta:`${m.torneos.length+1}.º torneo`,nombre:"Torneo nuevo",fechas:"",estado:"Próximo",finales:f});
      Object.values(m.ranking).forEach(rows=>rows.forEach(r=>r.push(null))); break; }
    case "del-t": if(!confirm(`¿Borrar ${m.torneos[n].nombre}? También se borran sus puntos del ranking y sus resultados.`)) return;
      delete m.resultados[m.torneos[n].id]; m.torneos.splice(n,1); Object.values(m.ranking).forEach(rows=>rows.forEach(r=>r.splice(n+1,1))); break;
    case "add-r": m.ranking[state.adminCat].push([state.mod==="dobles"?"Apellido / Apellido":"Apellido, Nombre",...m.torneos.map(()=>null)]); break;
    case "del-r": m.ranking[state.adminCat].splice(n,1); break;
    case "up-r": swap(m.ranking[state.adminCat],n,n-1); break;
    case "down-r": swap(m.ranking[state.adminCat],n,n+1); break;
    case "add-m": m.resultados[state.adminRes.t][state.adminRes.c][n].m.push(["","",""]); break;
    case "del-m": { const [ri,mi]=i.split(".").map(Number); m.resultados[state.adminRes.t][state.adminRes.c][ri].m.splice(mi,1); break; }
    case "del-f": d.fotos.splice(n,1); break;
    case "del-placeholders": d.fotos=d.fotos.filter(f=>f.src); break;
    case "discard": state.draft=clone(data); toast("Cambios descartados"); break;
    case "save": {
      Object.values(d.modalidades).forEach(mm=>Object.values(mm.resultados).forEach(tc=>Object.keys(tc).forEach(c=>{
        tc[c]=tc[c].map(r=>({name:r.name,m:r.m.filter(x=>x[0]||x[1])})); })));
      const prev=data; data=clone(d);
      if(saveData()) toast("Cambios guardados"); else data=prev;
      break; }
    case "export": { const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}); const a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="liga-de-padres-datos.json"; document.body.appendChild(a); a.click(); a.remove(); return; }
    case "reset": if(!confirm("¿Volver a los datos originales? Se pierde todo lo que editaste.")) return;
      data=clone(DEFAULT_DATA); saveData(); state.draft=clone(data); toast("Se restauraron los datos originales"); break;
    case "logout": logout(); return;
  }
  render();
}
function logout(){ state.admin=false; state.draft=null; try{sessionStorage.removeItem("liga:admin")}catch(e){} toast("Saliste del modo administrador"); location.hash=""; render(); }

function filterRank(){

/* ================= Eventos ================= */
function setSurface(v){
  state.surface=v; store.set("surface",v); document.documentElement.dataset.surface=v;
  document.querySelectorAll("[data-surface]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.surface===v));
}
function setMod(v){
  if(state.draft) syncDraft();
  state.mod=v; store.set("mod",v); state.profile=loadProfile(v); state.view=""; state.picking=false; state.round=0; state.q="";
  const r=location.hash.split("/")[0];
  if(r==="#resultados"||r==="#cuadro") location.hash="#torneos"; else render();
  toast(`Mostrando ${MOD_LABEL[v].toLowerCase()}`);
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-surface],[data-mod],[data-cat],[data-round],[data-photo],[data-sched],[data-player],[data-act],[data-atab],[data-acat],[data-admintab]");
  if(!el) return;
  const ds=el.dataset;
  if(ds.surface){ setSurface(ds.surface); return; }
  if(ds.mod){ if(ds.mod!==state.mod) setMod(ds.mod); return; }
  if(ds.admintab){ state.adminTab=ds.admintab; if(location.hash==="#admin"){ e.preventDefault(); render(); } return; }
  if(ds.sched!=null){ openSched(); return; }
  if(ds.cat){ state.cat=ds.cat; store.set("cat",ds.cat); render(); return; }
  if(ds.round){ state.round=+ds.round; render(); return; }
  if(ds.photo){ openPhoto(+ds.photo); return; }
  if(ds.player){ state.view=ds.player; state.picking=false; render(); window.scrollTo(0,0); return; }
  if(ds.atab){ syncDraft(); state.adminTab=ds.atab; render(); return; }
  if(ds.acat){ syncDraft(); state.adminCat=ds.acat; render(); return; }
  if(ds.act){
    const act=ds.act;
    if(act==="profile"){ const n=state.view||state.profile; state.profile=n; store.set("perfil:"+state.mod,n); toast("Guardado como tu perfil"); render(); return; }
    if(act==="unprofile"){ state.view=state.profile; state.profile=""; store.set("perfil:"+state.mod,""); toast("Ya no es tu perfil"); render(); return; }
    if(act==="pick"){ state.picking=true; state.view=""; render(); return; }
    if(act==="logout"){ logout(); return; }
    if(state.admin&&state.draft) adminAction(act,el);
  }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="loginForm"){ e.preventDefault();
    if(document.getElementById("pass").value===ADMIN_PASS){ state.admin=true; state.loginErr=false; state.draft=clone(data);
      try{sessionStorage.setItem("liga:admin","1")}catch(err){} toast("Ingresaste como administrador"); }
    else state.loginErr=true;
    render(); if(!state.admin){ const p=document.getElementById("pass"); p&&p.focus(); } }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="rankSearch"){ state.q=e.target.value; filterRank(); }
  if(id==="resSearch"){ const q=e.target.value.trim().toLowerCase();
    document.getElementById("roundView").hidden=!!q; const sv=document.getElementById("searchView"); sv.hidden=!q;
    sv.querySelectorAll("[data-m]").forEach(m=>m.hidden=!m.dataset.m.includes(q));
    sv.querySelectorAll("[data-group]").forEach(g=>g.hidden=!g.querySelector("[data-m]:not([hidden])")); }
  if(id==="pickSearch"){ const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll("[data-pn]").forEach(c=>c.hidden=!!q&&!c.dataset.pn.includes(q));
    document.querySelectorAll("[data-pgroup]").forEach(g=>g.hidden=!g.querySelector("[data-pn]:not([hidden])")); }
});
document.addEventListener("change",async e=>{
  const el=e.target, id=el.id;
  if(el.hasAttribute("data-rerender")){ syncDraft(); render(); return; }
  if(id==="resT"||id==="resC"){ syncDraft(); state.adminRes={t:document.getElementById("resT").value,c:document.getElementById("resC").value}; render(); return; }
  if(id==="upInfoFoto"&&el.files[0]){ syncDraft(); try{ state.draft.info.foto=await downscale(el.files[0],1600); state.draft.info.modo="foto"; toast("Foto lista. Tocá Guardar para publicarla."); }catch(err){ toast("No se pudo leer la imagen"); } render(); return; }
  if(id==="upFotos"&&el.files.length){ syncDraft(); let ok=0;
    for(const f of el.files){ try{ state.draft.fotos.push({src:await downscale(f),texto:""}); ok++; }catch(err){} }
    toast(`${ok} foto${ok===1?"":"s"} lista${ok===1?"":"s"}. Tocá Guardar para publicarlas.`); render(); return; }
  if(id==="importFile"&&el.files[0]){
    try{ const obj=migrate(JSON.parse(await el.files[0].text())); if(!obj.modalidades) throw 0;
      data=Object.assign(clone(DEFAULT_DATA),obj); saveData(); state.draft=clone(data); toast("Copia importada"); }
    catch(err){ toast("Ese archivo no es una copia válida"); }
    render(); }
});
window.addEventListener("hashchange",()=>{ state.round=0; if(!location.hash.startsWith("#partidos")) state.picking=false; render(); });

/* Lightbox fotos */
const lb=document.getElementById("lb");
function openPhoto(i){
  const n=data.fotos.length; if(!n) return; state.photo=(i+n)%n; const f=data.fotos[state.photo];
  document.getElementById("lbFig").innerHTML=f.src?`<img src="${esc(f.src)}" alt="${esc(f.texto||"Foto "+(state.photo+1))}">`:`<span>Foto ${state.photo+1}</span>`;
  document.getElementById("lbCount").textContent=`${state.photo+1} de ${n}${f.texto?`, ${f.texto}`:""}`;
  if(!lb.open) lb.showModal();
}
document.getElementById("lbPrev").onclick=()=>openPhoto(state.photo-1);
document.getElementById("lbNext").onclick=()=>openPhoto(state.photo+1);
document.getElementById("lbClose").onclick=()=>lb.close();
lb.addEventListener("click",e=>{ if(e.target===lb) lb.close(); });
lb.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") openPhoto(state.photo-1); if(e.key==="ArrowRight") openPhoto(state.photo+1); });
/* Visor de horarios */
const sv=document.getElementById("sv"), svBox=document.getElementById("svBox");
function openSched(){ const im=document.getElementById("svImg"); im.src=data.info.foto; im.alt=data.info.titulo;
  document.getElementById("svCap").textContent=data.info.titulo; svBox.classList.remove("zoom"); sv.showModal(); }
const toggleZoom=()=>svBox.classList.toggle("zoom");
document.getElementById("svImg").onclick=toggleZoom;
document.getElementById("svZoom").onclick=toggleZoom;
document.getElementById("svClose").onclick=()=>sv.close();
sv.addEventListener("click",e=>{ if(e.target===sv) sv.close(); });

/* Tema claro/oscuro */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyMode(){ const t=store.get("theme",null); document.documentElement.dataset.mode=(t?t==="dark":mq.matches)?"dark":"light"; }
mq.addEventListener&&mq.addEventListener("change",applyMode);
document.getElementById("themeBtn").onclick=()=>{ const next=document.documentElement.dataset.mode==="dark"?"light":"dark"; store.set("theme",next); applyMode(); };

applyMode();
render();
</script>
</body>
</html>
